/* The deck shell: bar, progress, stage, the scaled canvas, notes, overview.
   Cauchy visual identity v2: the tokens of lecture_materials/src/platform-infrastructure/head.html. */
:root{
  --bg:#f6f5f3; --panel:#ffffff; --alt:#f0efed; --ink:#1a1a1a; --body:#5a5a5a; --muted:#8a8a8a;
  --line:#e0dfdd; --line-soft:#ebeae8; --flame:#f24b37; --link:#337FF9;
  --sage-bg:#f0f5f2; --sage-bd:#c8dad2; --sage:#4e7566;
  --blue-bg:#f0f4fb; --blue-bd:#cdd8ed; --blue:#506fa0;
  --warm-bg:#faf6f0; --warm-bd:#e3d9ca; --warm:#8a7556;
  --gold:#d9a441; --dev:#c9705f; --ok:#3f9b6b; --no:#d64545;
  --bar-h:44px; --cw:1440px; --ch:850px; --k:1;
  --shadow:0 1px 2px rgba(26,26,26,.05),0 8px 28px rgba(26,26,26,.08);
  --shadow-up:0 2px 4px rgba(26,26,26,.06),0 18px 48px rgba(26,26,26,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--body);font:16px/1.45 "Nunito",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{color:var(--ink);font-weight:600;text-wrap:balance}
strong,b,em{color:var(--ink)}
b,strong{font-weight:700}
code,.mono,pre{font-family:"Fira Code",ui-monospace,monospace;font-size:.92em;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}

/* ----- the bar: brand, the five parts as the progress, controls ----- */
.bar{position:fixed;inset:0 0 auto 0;height:var(--bar-h);z-index:30;display:flex;align-items:center;gap:14px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:none;color:var(--ink);font-weight:600;font-size:16px}
.brand svg{width:22px;height:22px}
.parts{display:flex;align-items:stretch;gap:6px;flex:1 1 auto;min-width:0;height:100%}
.part{position:relative;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0 10px;color:var(--muted);
  font-size:16px;font-weight:600;white-space:nowrap;min-width:44px;flex:0 0 auto}
.part .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.part .t{display:none;overflow:hidden;text-overflow:ellipsis}
.part.on{color:var(--ink);flex:0 1 auto;min-width:0}
.part.on .t{display:block}
.part.on .n{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.part.done{color:var(--body)}
.part:hover{color:var(--ink)}
.part .track{position:absolute;left:6px;right:6px;bottom:0;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.part .fill{display:block;height:100%;width:0;background:var(--flame);border-radius:2px;transition:width .35s ease}
.bar-r{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
.bar-r button,.keys-chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:16px;font-weight:500;line-height:1.4;white-space:nowrap}
.bar-r button:hover{background:var(--alt)}
.bar-r button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.bar-r button:disabled{opacity:.4;cursor:default}
#bPrev,#bNext{width:34px;padding:3px 0;font-size:19px;line-height:1.15}
.count{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px;white-space:nowrap}
.keys-chip{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;background:var(--warm-bg);border:1px dashed var(--warm-bd);color:var(--warm)}
body.in-frame .brand-t{display:none}

/* ----- the stage and its layers ----- */
.stage{position:fixed;inset:var(--bar-h) 0 0 0;overflow:hidden;background:var(--bg)}
.layer{position:absolute;inset:0;overflow:hidden}
.layer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.canvas{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);transform:translate(-50%,-50%) scale(var(--k));transform-origin:50% 50%;
  font-size:18.5px;line-height:1.42;color:var(--body)}
.canvas h2{font-size:34px;line-height:1.15;letter-spacing:-.02em}
.canvas h3{font-size:24px;line-height:1.2}
.canvas code,.canvas .mono{font-size:18.2px}
.canvas code{background:var(--alt);color:var(--ink);padding:1px 6px;border-radius:5px}
.eyebrow{text-transform:uppercase;letter-spacing:.07em;font-size:18.2px;color:var(--muted);font-weight:600}
a.gh{color:inherit;text-decoration:underline;text-decoration-color:var(--blue-bd);text-decoration-thickness:1.5px;text-underline-offset:3px}
a.gh:hover{color:var(--link);text-decoration-color:var(--link)}

/* a frame that has not answered: the placeholder */
.hole{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:
  repeating-linear-gradient(135deg,transparent 0 22px,rgba(26,26,26,.025) 22px 44px),var(--bg)}
.hole-c{max-width:760px;background:var(--panel);border:1.5px dashed var(--warm-bd);border-radius:14px;padding:30px 34px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);font-size:18.5px}
.hole-c h3{font-size:26px}
.hole-c code{background:var(--alt);color:var(--ink);padding:1px 6px;border-radius:5px}
.hole-c .row{display:flex;gap:10px;margin-top:6px}
.hole-c button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 16px;font-size:17px;font-weight:500}
.hole-c button:hover{background:var(--alt)}

/* ----- speaker notes: a sheet over the bottom of the stage ----- */
.notes{position:fixed;left:20px;right:20px;bottom:16px;max-height:42vh;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-up);display:flex;flex-direction:column;overflow:hidden}
.notes header{display:flex;align-items:baseline;gap:16px;padding:12px 18px 8px;border-bottom:1px solid var(--line-soft)}
.notes header b{font-size:19px;color:var(--ink)}
.notes header span{color:var(--muted);font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notes header button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 12px;font-size:16px;color:var(--ink)}
#notesB{padding:10px 18px 16px;overflow:auto;font-size:19px;line-height:1.5;color:var(--ink)}
#notesB p{margin:0 0 8px;max-width:110ch}
#notesB ul{margin:0 0 8px;padding-left:22px}
#notesB code{background:var(--alt);padding:1px 5px;border-radius:4px}

/* ----- overview ----- */
.over{position:fixed;inset:var(--bar-h) 0 0 0;z-index:35;background:var(--bg);overflow:auto;padding:22px 28px 40px}
.over>header{display:flex;align-items:baseline;gap:18px;margin-bottom:14px}
.over>header h2{font-size:26px}
.over>header p{color:var(--muted);font-size:16px}
.over-g{display:flex;flex-direction:column;gap:16px}
.over-p{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.over-p h3{font-size:18px;line-height:1.3;padding-top:10px}
.over-p h3 small{display:block;color:var(--flame);font-size:16px;font-weight:700;letter-spacing:.04em}
.over-s{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.over-c{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-height:86px;transition:transform .15s ease,box-shadow .15s ease}
.over-c:hover,.over-c.sel{transform:translateY(-2px);box-shadow:var(--shadow)}
.over-c.sel{border-color:var(--ink)}
.over-c.cur{border-color:var(--flame);box-shadow:inset 0 0 0 1px var(--flame)}
.over-c .id{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.over-c .tt{font-size:17px;font-weight:600;color:var(--ink);line-height:1.25}
.over-c .kd{font-size:16px;color:var(--muted)}

.fatal{position:fixed;inset:var(--bar-h) 0 0 0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:40px;font-size:20px;color:var(--ink);text-align:center}
.fatal div{max-width:720px;background:var(--panel);border:1.5px dashed var(--warm-bd);border-radius:14px;padding:30px}
@media (prefers-reduced-motion:reduce){.part .fill{transition:none}}

/* Part 1: the beats sit on a dimmed still of the animated map (src/assets/day-still.jpg, made by still.py) */
.still{position:absolute;inset:-12px;background:#2a2d31 var(--still) center top/cover no-repeat;filter:blur(3px) saturate(.55) brightness(.42)}
.still::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(20,22,26,.25),rgba(20,22,26,.72))}
.p1 .beat{position:absolute;inset:0;padding:34px 44px}
.p1-h{display:flex;flex-direction:column;gap:4px}
.p1-h .eyebrow{color:#e9c9a0}
.p1-h h2{color:#fff;font-size:44px}
.p1 .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.18),0 24px 60px rgba(0,0,0,.32)}

/* beat 1: how much there is */
.b-much .one{position:absolute;left:44px;top:150px;width:548px;padding:24px 26px;display:flex;flex-direction:column;gap:12px}
.one-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.one-l li{display:grid;grid-template-columns:36px 184px 1fr;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:18.5px}
.one-l li:last-child{border-bottom:0}
.one-l .cnt{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;font-size:18.5px;font-variant-numeric:tabular-nums}
.one-l .w{color:var(--ink);font-weight:600}
.one-l .d{color:var(--body);white-space:nowrap}
.one-f{font-size:18.5px;border-top:1px solid var(--line);padding-top:12px}
.b-much .many{position:absolute;left:620px;top:150px;width:776px;padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.many-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.many-h .big{font-size:72px;line-height:.95;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.many-h .unit{font-size:26px;color:var(--ink);font-weight:600;margin-left:12px}
.many-h p{font-size:19px;text-align:right;max-width:330px}
.mx{width:100%;height:auto;display:block}
.once{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips>span,.chips>a{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 13px;font-size:18.5px;color:var(--ink);white-space:nowrap}

/* beat 2: what goes wrong by hand */
.wrong{position:absolute;left:44px;right:44px;top:156px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.w-c{padding:22px 20px 24px;display:flex;flex-direction:column;gap:10px;min-height:316px}
.w-c .gl{width:44px;height:44px;stroke:var(--no);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;background:#fbeeee;border-radius:12px;padding:8px}
.w-c h3{font-size:23px;line-height:1.2}
.w-c p{font-size:18.5px}
.incident{position:absolute;left:44px;right:44px;top:520px;padding:26px 32px;display:flex;align-items:center;gap:30px;border-left:6px solid var(--flame)!important}
.incident .when{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:150px;height:150px;border-radius:50%;background:var(--ink);color:#fff}
.incident .when b{color:#fff;font-size:34px;line-height:1.1}
.incident .when span{font-size:20px;opacity:.75}
.incident h3{font-size:28px;margin-bottom:8px}
.incident p{font-size:23px;line-height:1.4;max-width:60ch}

/* beat 3: the answer */
.iac{position:absolute;left:44px;top:146px;display:flex;gap:22px;align-items:baseline;font-size:104px;font-weight:700;letter-spacing:-.035em;color:#fff;line-height:1.05}
.iac .code{font-family:"Fira Code",monospace;font-weight:500;color:#ffd9b8;letter-spacing:-.05em}
.iac .code::before{content:"{ ";color:var(--flame)}
.iac .code::after{content:" }";color:var(--flame)}
.answer{position:absolute;left:44px;right:44px;top:330px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.a-c{padding:22px 20px 24px;display:flex;flex-direction:column;gap:8px;min-height:250px}
.a-c .no{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);color:var(--ink);font-weight:700;font-size:18.5px}
.a-c h3{font-size:27px}
.a-c p{font-size:19.5px}
.p1-next{position:absolute;left:44px;top:640px;color:#fff;font-size:28px;font-weight:500;max-width:28ch;line-height:1.3}

/* Part 2: the mocks are dark, like the product; the code panel is the deck's own */
.p2{display:grid;grid-template-columns:760px 1fr;gap:16px;padding:12px 18px 14px}
.p2-l{display:flex;flex-direction:column;gap:8px;min-height:0}
.p2-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;height:38px;flex:none}
.sw{display:inline-flex;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px}
.sw button{border:0;background:none;border-radius:999px;padding:2px 16px;font-size:18.2px;font-weight:600;color:var(--body)}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.p2-note{font-size:18.2px;color:var(--muted);white-space:nowrap}

.mock{--m-bg:#11171c;--m-side:#161d23;--m-top:#0c1115;--m-line:#27333d;--m-ink:#e6ebef;--m-mut:#93a4b2;--m-blue:#5aa9f2;--m-sel:#17344d;--m-card:#1a232b;--m-ok:#43b36b;
  flex:1;min-height:0;display:flex;flex-direction:column;background:var(--m-bg);color:var(--m-ink);border-radius:12px;overflow:hidden;
  box-shadow:0 2px 6px rgba(26,26,26,.12),0 22px 54px rgba(26,26,26,.24);font-size:18.2px;line-height:1.3}
.mock button{color:inherit}
.gl{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.m-top{height:46px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--m-top);border-bottom:1px solid var(--m-line)}
.m-home{border:0;background:none;padding:0;display:flex}
.m-mark{width:24px;height:26px}
.m-acct{color:var(--m-ink);font-weight:600;font-size:18.2px}
.m-badge{border:1px dashed #6f8191;color:#b9c6d1;border-radius:6px;padding:0 8px;font-size:16.5px;letter-spacing:.08em;text-transform:uppercase;line-height:1.5}
.m-gap{flex:1}
.m-dd{position:relative}
.m-sw{border:1px solid var(--m-line);background:var(--m-card);border-radius:8px;padding:3px 12px;font-size:18.2px}
.m-sw i{font-style:normal;color:var(--m-mut);margin-left:4px}
.m-av{width:32px;height:32px;border-radius:50%;border:0;background:#7a5af5;color:#fff!important;font-weight:700;font-size:18.2px;display:inline-flex;align-items:center;justify-content:center}
.m-menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:230px;background:#202b34;border:1px solid var(--m-line);border-radius:10px;padding:6px;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.m-menu-pop>*{padding:6px 12px;border-radius:6px;font-size:18.2px;text-align:left;white-space:nowrap;border:0;background:none;color:var(--m-ink)}
.m-menu-pop span{color:var(--m-mut)}
.m-menu-pop button:hover{background:var(--m-sel)}
.m-body{flex:1;min-height:0;display:grid;grid-template-columns:232px 1fr}
.m-side{background:var(--m-side);border-right:1px solid var(--m-line);padding:6px 8px;display:flex;flex-direction:column;overflow:hidden}
.m-side h4{margin:0;padding:5px 8px 0;height:26px;font-size:16.5px;font-weight:600;color:var(--m-mut);flex:none}
.m-i{display:flex;align-items:center;gap:9px;height:24px;flex:none;border:0;background:none;border-radius:6px;padding:0 8px;font-size:18.2px;text-align:left;white-space:nowrap;color:var(--m-ink)}
.m-i .gl{color:var(--m-mut);width:17px;height:17px}
.m-i:hover{background:#1f2a33}
.m-i.on{background:var(--m-sel);color:#a9d5ff}
.m-i.on .gl{color:#a9d5ff}
.m-new{height:28px;margin-bottom:2px;background:#1f2a33;font-weight:600}
.m-new .gl{background:#e5484d;color:#fff;border-radius:50%;padding:2px;width:19px;height:19px;stroke-width:2.2}
.mock[data-cons="account"] .m-i{height:32px}
.mock[data-cons="account"] .m-side h4{height:34px;padding-top:10px}
.m-page{min-width:0;padding:16px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.m-ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
.m-ph h3,.m-homep h3{color:var(--m-ink);font-size:25px;font-weight:600}
.m-btn{border:1px solid var(--m-line);background:var(--m-card);border-radius:7px;padding:3px 13px;font-size:18.2px;color:var(--m-ink);white-space:nowrap}
.m-btn.pri{background:#2272b4;border-color:#2272b4;color:#fff}
.m-pb{display:flex;flex-direction:column;gap:12px;min-height:0}
.nm{color:var(--m-blue)}
.c-call{font-family:"Fira Code",monospace;font-size:17.5px;color:var(--body);font-variant-ligatures:none}
.m-t{width:100%;border-collapse:collapse;font-size:17.5px}
.m-t th{text-align:left;font-weight:600;color:var(--m-mut);padding:6px;border-bottom:1px solid var(--m-line);white-space:nowrap}
.m-t td{padding:8px 6px;border-bottom:1px solid #1d2730;white-space:nowrap}
.m-t .mono{font-size:17.5px}
.st{display:inline-flex;align-items:center;gap:7px}
.st i{width:9px;height:9px;border-radius:50%;background:var(--m-mut)}
.st-ok i{background:var(--m-ok)}
.m-tabs{display:flex;gap:18px;border-bottom:1px solid var(--m-line)}
.m-tabs span{padding:4px 0 7px;color:var(--m-mut);border-bottom:2px solid transparent;white-space:nowrap}
.m-tabs span.on{color:var(--m-ink);border-color:var(--m-blue)}
.m-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 30px;border:1px dashed var(--m-line);border-radius:10px;color:var(--m-mut)}
.m-empty .gl{width:38px;height:38px;stroke-width:1.2}
.m-empty b{color:var(--m-ink);font-size:20px}
.m-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-card{background:var(--m-card);border:1px solid var(--m-line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.m-card .gl{width:24px;height:24px;color:var(--m-blue)}
.m-card b{color:var(--m-ink);font-weight:600}
.m-card span{color:var(--m-mut)}
.m-tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.m-tree li{display:flex;align-items:center;gap:8px;height:34px;padding-left:calc(var(--d) * 26px);white-space:nowrap}
.m-tree .tw{width:14px;font-style:normal;color:var(--m-mut)}
.m-tree .gl{color:var(--m-mut)}
.m-tree em{font-style:normal;color:var(--m-mut);margin-left:6px;overflow:hidden;text-overflow:ellipsis}
.m-menu{list-style:none;margin:0;padding:6px;background:var(--m-card);border:1px solid var(--m-line);border-radius:10px;width:300px}
.m-menu li{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:6px}
.m-menu li:first-child{background:var(--m-sel)}
.m-menu .gl{color:var(--m-mut)}
.m-kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:0}
.m-kv dt{color:var(--m-mut)}
.m-kv dd{margin:0;overflow-wrap:anywhere}
.m-kv .mono{font-size:17.5px}
.m-tog{list-style:none;margin:0;padding:0}
.m-tog li{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #1d2730}
.tg{width:40px;height:22px;border-radius:11px;background:#3a4853;position:relative;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#cfd8df}
.tg.on{background:#2272b4}
.tg.on::after{left:21px;background:#fff}
.sk{display:inline-block;height:12px;border-radius:6px;background:#2a3640}
.m-sub{color:var(--m-mut);font-size:18.2px}
.m-flow{display:flex;align-items:center;gap:10px}
.m-flow span{display:flex;align-items:center;gap:8px;background:var(--m-card);border:1px solid var(--m-line);border-radius:8px;padding:8px 12px}
.m-flow i{font-style:normal;color:var(--m-mut)}
.m-ed{border:1px solid var(--m-line);border-radius:10px;overflow:hidden}
.m-ed-bar{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--m-card);border-bottom:1px solid var(--m-line)}
.m-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--m-line);border-radius:999px;padding:2px 12px;color:var(--m-ink);background:var(--m-card);align-self:flex-start}
.m-code{margin:0;padding:12px 14px;font:18.2px/1.5 "Fira Code",monospace;color:var(--m-ink);white-space:pre-wrap}
.m-code b{color:#c792ea;font-weight:500}
.m-chat{display:flex;flex-direction:column;gap:12px}
.m-chat p{max-width:86%;padding:9px 14px;border-radius:12px}
.m-chat .u{align-self:flex-end;background:#2272b4;color:#fff}
.m-chat .b{background:var(--m-card);border:1px solid var(--m-line)}
.m-ask,.m-askbox{border:1px solid var(--m-line);border-radius:10px;padding:10px 14px;color:var(--m-mut);background:var(--m-card)}
.m-homep{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:54px}
.m-homep h3{font-size:30px}
.m-askbox{width:100%;display:flex;align-items:center;gap:10px;border-radius:14px;padding:13px 16px}
.m-askbox .gl{color:var(--m-blue);width:22px;height:22px}
.m-rec{width:100%;display:flex;flex-direction:column}
.m-rec h5{margin:10px 0 4px;font-size:18.2px;color:var(--m-mut);font-weight:600}
.m-rr{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #1d2730}
.m-rr .gl{color:var(--m-mut)}
.m-rr em{margin-left:auto;font-style:normal;color:var(--m-mut)}
.m-setnav{display:flex;flex-wrap:wrap;gap:6px}
.m-setnav button{border:1px solid var(--m-line);background:none;border-radius:999px;padding:2px 12px;font-size:18.2px}
.m-setnav button.on{background:var(--m-sel);color:#a9d5ff;border-color:#2c5f8c}
.m-ws{border:1px solid var(--m-line);border-radius:10px;overflow:hidden}
.m-ws .band{display:grid;gap:2px 12px;padding:10px 14px;border-bottom:1px solid var(--m-line);align-items:center}
.m-ws .band:last-child{border-bottom:0}
.m-ws .b4{grid-template-columns:1.1fr 1.1fr 1.2fr 1fr}
.m-ws .b2{grid-template-columns:1.9fr 1fr}
.m-ws label{color:var(--m-mut);font-size:16.5px;font-weight:600}
.m-chip{font-style:normal;border:1px solid var(--m-line);border-radius:999px;padding:0 10px;color:var(--m-mut);white-space:nowrap;margin-left:4px}
.m-bars{height:200px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--m-line);padding:0 6px}
.m-bars i{flex:1;background:linear-gradient(#5aa9f2,#2272b4);border-radius:4px 4px 0 0}

/* the code panel */
.code-panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.c-head{display:flex;flex-direction:column;gap:5px}
.c-what{font-size:20px;color:var(--ink);font-weight:600;line-height:1.3}
.c-say{font-size:18.5px;color:var(--warm);background:var(--warm-bg);border:1px dashed var(--warm-bd);border-radius:8px;padding:6px 12px}
.c-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.c-tabs button{border:0;background:none;padding:6px 16px 9px;font-size:19px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.c-tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--flame)}
.c-tabs button:hover{color:var(--ink)}
.c-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.c-meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.c-meta p{font-size:18.5px;overflow-wrap:anywhere}
.c-meta code{font-size:17.5px}
.c-chip{border:1px solid var(--blue-bd);background:var(--blue-bg);color:var(--blue);border-radius:999px;padding:1px 12px;font-size:18.2px;white-space:nowrap}
.c-chip code{background:none;padding:0;color:inherit}
.c-code{flex:0 1 auto;min-height:0;margin:0;background:#fbfaf8;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto}
.c-code code{display:block;background:none;padding:0;font:18.2px/1.5 "Fira Code",monospace;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2}
.t-c{color:var(--muted);font-style:italic}
.t-s{color:var(--sage)}
.t-k{color:#b23a2b;font-weight:500}
.t-n{color:var(--warm)}
.t-a{color:var(--blue)}
.t-f{color:#6b4fa0}
.t-p{color:var(--ink);font-weight:500}
.c-foot{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-top:auto;flex-wrap:wrap}
.c-foot a.docs{font-size:18.2px;font-weight:600}
.c-foot a.quiet{font-size:16.5px;color:var(--muted);text-decoration-color:var(--line)}
.c-intro{display:flex;flex-direction:column;gap:16px;padding:10px 4px}
.c-intro h2{font-size:38px}
.c-intro p{font-size:20px}
.c-three{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:n}
.c-three li{counter-increment:n;display:grid;grid-template-columns:40px 1fr;column-gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--bg)}
.c-three li::before{content:counter(n);grid-row:1 / span 2;align-self:center;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);color:var(--ink);font-weight:700}
.c-three b{font-size:21px}
.c-three span{font-size:18.5px}
.c-hint{color:var(--muted)}

/* Part 3: three tiles, their project cards, and the joined diagram */
.p3-h{position:absolute;left:30px;top:16px;display:flex;flex-direction:column;gap:0}
.p3-h h2{font-size:32px}
.t-warm{--t:var(--warm);--t-bg:var(--warm-bg);--t-bd:var(--warm-bd);--t-hi:#d9a441}
.t-sage{--t:var(--sage);--t-bg:var(--sage-bg);--t-bd:var(--sage-bd);--t-hi:#4e7566}
.t-blue{--t:var(--blue);--t-bg:var(--blue-bg);--t-bd:var(--blue-bd);--t-hi:#506fa0}

.tile{position:absolute;top:0;text-align:left;border:1.5px solid var(--t-bd);background:var(--panel);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:22px;
  box-shadow:var(--shadow);overflow:hidden;color:var(--body);font-size:18.5px;transition:box-shadow .3s ease,border-color .3s ease}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--t-hi)}
.tile:hover{box-shadow:var(--shadow-up)}
.tile.now{border-color:var(--t-hi);box-shadow:var(--shadow-up)}
.tile-h{display:flex;align-items:center;gap:14px}
.tile .no{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--t-hi);color:#fff;font-weight:700;font-size:20px;flex:none}
.tile .gl{width:44px;height:44px;color:var(--t);stroke-width:1.3;background:var(--t-bg);border-radius:12px;padding:8px}
.tile .tt{display:flex;flex-direction:column;min-width:0}
.tile .tt b{font-size:25px;line-height:1.2;color:var(--ink)}
.tile .tt span{font-size:18.5px;color:var(--body)}
.tile .q{font-size:27px;line-height:1.3;color:var(--ink);font-weight:500;transition:opacity .3s ease}
.tile.up .q{opacity:0}

.kcard{position:absolute;top:222px;height:606px;background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:14px 20px 14px;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);font-size:18.5px;line-height:1.38;overflow:hidden}
.kcard::before{content:"";position:absolute;left:36px;top:-14px;width:2px;height:14px;background:var(--t-bd)}
.kcard .eyebrow{color:var(--t)}
.k-name{display:flex;align-items:center;gap:12px}
.k-name .ic{width:38px;height:38px}
.k-name div{display:flex;flex-direction:column;min-width:0}
.k-name b{font-size:22px;color:var(--ink);line-height:1.25}
.k-name b.mono{font-size:20.5px}
.k-name span{color:var(--body)}
.k-row{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line-soft);padding-top:8px}
.k-l{font-weight:700;color:var(--ink)}
.k-b{display:flex;flex-direction:column;gap:3px}
.k-b p{overflow-wrap:anywhere}
.kcard .chips{gap:6px}
.kcard .chips a{border:1px solid var(--t-bd);background:var(--t-bg);border-radius:999px;padding:2px 12px;color:var(--ink);text-decoration:none;white-space:nowrap}
.kcard .chips a:hover{border-color:var(--link);color:var(--link)}
.kcard .chips a.mono{font-size:18.2px}
.k-tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.k-tree li{display:grid;grid-template-columns:212px 1fr;align-items:baseline;height:27px;white-space:nowrap}
.k-tree li.in{padding-left:20px;grid-template-columns:192px 1fr}
.k-tree code{background:none;padding:0}
.k-tree span{color:var(--body)}
.k-pat{color:var(--ink)}
.k-pat i{font-style:normal;color:var(--t-hi);font-weight:700}
.k-ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.k-ul li::marker{color:var(--t-hi)}

/* the joined diagram */
.dia{position:absolute;inset:0;pointer-events:none}
.dia-s{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dia .edge{fill:none;stroke:#8a8a8a;stroke-width:2}
.pk{opacity:0}
.pk.dev{fill:var(--dev)} .pk.gold{fill:var(--gold)} .pk.back,.pk.call,.pk.call2{fill:var(--blue)}
.peri{position:absolute;border:2px solid #b9c1cf;background:#e9edf3;border-radius:22px}
.peri>span{position:absolute;left:22px;top:12px;display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700;color:#3d4a61}
.peri .ic{width:22px;height:22px}
.outside{position:absolute;font-size:20px;font-weight:700;color:var(--warm)}
.nd{position:absolute;background:var(--panel);border:1.5px solid var(--t-bd,var(--line));border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);font-size:18.5px;line-height:1.35}
.nd b{color:var(--ink);font-size:21px;line-height:1.2}
.nd b.mono{font-size:19.5px}
.nd>.ic{width:30px;height:30px}
.nd>code{align-self:flex-start;margin-top:auto}
.nd .tag{position:absolute;right:-12px;top:-14px;width:36px;height:36px;border-radius:50%;background:var(--t-hi);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.nd .tick{position:absolute;left:-12px;top:-14px;width:34px;height:34px;border-radius:50%;background:var(--ok);color:#fff;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0}
.elabel{position:absolute;transform:translateX(-50%);background:var(--bg);border:1.5px solid;border-radius:999px;padding:0 12px;font-size:18.2px;font-weight:700;white-space:nowrap}
.elabel.gold{color:#9a6d12;border-color:var(--gold);background:#fdf6e6}
.elabel.back{color:var(--blue);border-color:var(--blue-bd);background:var(--blue-bg)}
.story{position:absolute;margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.story li{counter-increment:s;position:relative;padding:9px 14px 9px 52px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:18.5px;line-height:1.35;transition:border-color .3s ease,box-shadow .3s ease,background .3s ease}
.story li::before{content:counter(s);position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:17px}
.story li.on{border-color:var(--ink);box-shadow:var(--shadow)}
.story li.on::before{background:var(--ink);color:#fff}

.kcard code,.nd code,.story code{white-space:nowrap}

/* the joined diagram's layers: perimeter, then the roads, then the boxes and labels */
.peri{z-index:0}
.dia-s{z-index:1}
.dia .nd,.dia .elabel,.dia .story,.dia .outside{z-index:2}

/* Part 5: the onboarding run as one drawing; every box is a link */
.p5-h{position:absolute;left:30px;right:30px;top:12px;display:flex;align-items:flex-end;justify-content:space-between}
.p5-h h2{font-size:32px}
.p5-h p{color:var(--muted);font-size:18.5px}
.p5 .lbl{position:absolute;left:30px;font-size:18.2px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rowx{position:absolute;left:30px;width:1380px;height:80px;display:flex;align-items:stretch}
.rowx .arr{flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--muted);font-size:20px}
.rowx .arr.oidc{color:var(--gold)}
.o-r1 .bx,.o-r3 .bx{flex:1 1 0}
.bx{position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;
  color:var(--body);text-decoration:none;box-shadow:0 1px 2px rgba(26,26,26,.05);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;font-size:18.5px;line-height:1.3}
a.bx:hover,a.bx:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-up);border-color:var(--link);z-index:2}
.bx.hot{border-color:var(--flame);box-shadow:0 0 0 3px rgba(242,75,55,.16),var(--shadow)}
.bx .t{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:700;white-space:nowrap}
.bx .t code,.bx>code{background:none;padding:0}
.bx>code{color:var(--blue)}
.bx .t .ic{width:22px;height:22px}
.bx .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx .no{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;font-style:normal;font-size:16px;font-weight:700;flex:none}
.act{border-color:var(--warm-bd);background:var(--warm-bg)}
.act:nth-of-type(n+3){border-color:var(--blue-bd);background:var(--blue-bg)}
.vl{position:absolute;width:2px;height:14px;background:var(--muted)}
.vl::after{content:"";position:absolute;left:-4px;bottom:-1px;border:5px solid transparent;border-top-color:var(--muted);border-bottom:0}
.o-steps{position:absolute;left:30px;width:1380px;height:218px;border:1.5px solid var(--sage-bd);background:var(--sage-bg);border-radius:16px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s ease,border-color .2s ease}
.o-steps.hot{border-color:var(--flame);box-shadow:0 0 0 3px rgba(242,75,55,.16)}
.o-steps header{display:flex;align-items:center;gap:16px;height:40px}
.o-steps header .bx{flex-direction:row;align-items:center;gap:12px;padding:4px 14px;height:40px}
.o-steps header p{font-size:18.5px;color:var(--sage)}
.o-steps header p b{color:var(--sage)}
.o-steps header p code{background:var(--panel)}
.o-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:1fr 1fr;gap:8px}
.stp{padding:6px 9px;border-color:var(--sage-bd)}
.stp .t{justify-content:space-between;gap:4px}
.stp .x{font-style:normal;font-size:16.5px;font-weight:700;color:var(--sage);background:var(--sage-bg);border:1px solid var(--sage-bd);border-radius:999px;padding:0 5px}
.bx.note{background:none;border-style:dashed;border-color:var(--sage-bd);box-shadow:none;padding:6px 12px}
.bx.note .t{font-weight:600;color:var(--sage)}
.bx.note .gl{width:20px;height:20px}
.o-state{position:absolute;left:30px;width:1380px;height:62px;display:flex;align-items:center;gap:12px;border:1.5px solid var(--blue-bd);background:var(--blue-bg);border-radius:14px;padding:0 14px;font-size:18.5px;white-space:nowrap;justify-content:space-between}
.o-state>.ic{width:30px;height:30px}
.o-state .st-t{color:var(--ink);font-weight:600}
.o-state .st-t code{background:var(--panel)}
.o-state .tb{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--blue-bd);border-radius:999px;padding:2px 12px 2px 4px}
.o-state .tb i{font-style:normal;font-size:16px;font-weight:700;color:#fff;background:var(--ink);border-radius:12px;padding:0 8px;line-height:1.5}
.o-state .tb code{background:none;padding:0}
.o-strip{position:absolute;left:30px;top:704px;width:1380px;height:134px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--flame);border-radius:12px;padding:12px 20px;font-size:19px;line-height:1.42;box-shadow:var(--shadow);overflow:hidden}
.o-strip b{font-size:20px}
.o-strip .more{color:var(--muted)}
.o-strip .more code{color:var(--ink)}
/* the beats: dim what the beat is not about */
.p5[data-beat="1"] .o-act,.p5[data-beat="1"] .o-r1,.p5[data-beat="1"] .o-r3,.p5[data-beat="1"] .o-state,.p5[data-beat="1"] .lbl{opacity:.38}
.p5[data-beat="2"] .o-act,.p5[data-beat="2"] .o-r1,.p5[data-beat="2"] .lbl{opacity:.45}
.p5[data-beat="2"] .o-state,.p5[data-beat="2"] [data-d="s-8"]{box-shadow:0 0 0 3px rgba(80,111,160,.22),var(--shadow);border-color:var(--blue)}

</style>
</head>

const gl = (name, cls = "") => `<svg class="gl ${cls}" viewBox="0 0 20 20" aria-hidden="true"><path d="${GLYPH[name] || GLYPH.doc}"/></svg>`;

// ----- a small syntax highlighter for the three forms: HCL, Python, and an HTTP request with a JSON body -----
const HL_RX = {
  hcl: /(?<c>#[^\n]*)|(?<s>"(?:[^"\\\n]|\\.)*")|(?<k>\b(?:resource|data|variable|true|false|null)\b)|(?<n>\b\d+(?:\.\d+)?\b)|(?<a>\b[a-z_][a-z0-9_]*(?=\s*=[^=]))|(?<f>\b[a-z_][a-z0-9_]*(?=\s*\{))/g,
  py: /(?<c>#[^\n]*)|(?<s>"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(?<k>\b(?:from|import|for|in|True|False|None)\b)|(?<n>\b\d+(?:\.\d+)?\b)|(?<f>\b[A-Za-z_][A-Za-z0-9_]*(?=\())|(?<a>\b[a-z_][a-z0-9_]*(?==))/g,
  http: /(?<k>^(?:GET|POST|PUT|PATCH|DELETE)\b)|(?<p>\/api\/[^\s]*)|(?<a>"(?:[^"\\\n]|\\.)*"(?=\s*:))|(?<s>"(?:[^"\\\n]|\\.)*")|(?<n>-?\b\d+(?:\.\d+)?\b)|(?<f>\b(?:true|false|null)\b)/gm,
};
function highlight(code, lang) {
  let out = "", last = 0;
  for (const m of code.matchAll(HL_RX[lang])) {
    out += esc(code.slice(last, m.index));
    const kind = Object.keys(m.groups).find((g) => m.groups[g] !== undefined);
    out += `<span class="t-${kind}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

// ----- the deck shell: scenes and steps, navigation, the parts as progress, overview, notes, full screen -----
// A scene is one layer of the stage (a scaled canvas or a full-step frame); a step is one beat of a
// scene. Next walks the beats, then the scenes. Each part's file registers its scenes and steps.
const PARTS = [
  {n: 1, title: "The platform is complex"},
  {n: 2, title: "Everything you click is code"},
  {n: 3, title: "What you need to run IaC"},
  {n: 4, title: "dev → acc → prd for infrastructure"},
  {n: 5, title: "The LLMOps onboarding automation"},
];

const Deck = (() => {
  const stage = $("#stage");
  const scenes = {};
  const steps = [];
  let cur = -1;
  let overSel = 0;

  // def: {kind: "canvas" | "frame", build(layer, canvas), show(beat, ctx), hide(), onNext(), skippable}
  function scene(id, def) { scenes[id] = Object.assign({id, built: false, layer: null}, def); }
  // def: {part, scene, beat, title, kind, notes}
  function step(def) {
    const inPart = steps.filter((s) => s.part === def.part).length + 1;
    steps.push(Object.assign({id: `${def.part}.${inPart}`, beat: 0, kind: ""}, def));
  }

  function mount(sc) {
    if (sc.built) return;
    sc.layer = el(`<section class="layer layer-${sc.kind}" data-scene="${sc.id}" hidden></section>`);
    let canvas = null;
    if (sc.kind === "canvas") { canvas = el(`<div class="canvas"></div>`); sc.layer.append(canvas); }
    stage.append(sc.layer);
    sc.build(sc.layer, canvas);
    sc.built = true;
  }

  function fit() {
    const k = Math.min(stage.clientWidth / 1440, stage.clientHeight / 850);
    document.documentElement.style.setProperty("--k", String(k));
    Deck.k = k;
  }

  function go(i, opt = {}) {
    i = clamp(i, 0, steps.length - 1);
    if (i === cur && !opt.force) return;
    const from = steps[cur], to = steps[i];
    const dir = cur < 0 ? 1 : Math.sign(i - cur) || 1;
    const old = from ? scenes[from.scene] : null, next = scenes[to.scene];
    // the keys come back to the deck whenever it moves
    if (document.activeElement && document.activeElement.tagName === "IFRAME") { document.activeElement.blur(); window.focus(); }
    mount(next);
    const instant = opt.instant || REDUCED || !old;
    cur = i;
    if (old !== next) {
      for (const s of Object.values(scenes)) if (s.built && s !== old && s !== next) { gsap.killTweensOf(s.layer); s.layer.hidden = true; }
      next.layer.hidden = false;
      gsap.killTweensOf(next.layer);
      if (old) {
        gsap.killTweensOf(old.layer);
        if (old.hide) old.hide();
        if (instant) old.layer.hidden = true;
        else gsap.to(old.layer, {autoAlpha: 0, duration: 0.3, ease: "power1.out", onComplete() { old.layer.hidden = true; }});
      }
      if (instant) gsap.set(next.layer, {autoAlpha: 1});
      else gsap.fromTo(next.layer, {autoAlpha: 0}, {autoAlpha: 1, duration: 0.45, ease: "power1.out"});
      next.show(to.beat, {dir, instant, from: null, entered: true});
    } else {
      next.show(to.beat, {dir, instant: opt.instant || REDUCED, from: from.beat, entered: false});
    }
    paint();
    try { history.replaceState(null, "", "#" + to.id); } catch (e) { /* a file page may refuse it */ }
  }

  // Next asks the scene first: a frame may want the key (part 4 passes it to its module)
  function next(force) {
    const sc = scenes[steps[cur].scene];
    if (!force && sc.onNext && sc.onNext(steps[cur].beat)) return;
    go(cur + 1);
  }
  const prev = () => go(cur - 1);
  const goId = (id) => { const i = steps.findIndex((s) => s.id === id); if (i >= 0) go(i); };
  const goPart = (n) => { const i = steps.findIndex((s) => s.part === n); if (i >= 0) go(i); };

  // ----- the bar -----
  const partsEl = $("#parts");
  function buildBar() {
    partsEl.innerHTML = PARTS.map((p) => `<button class="part" data-part="${p.n}" title="Part ${p.n}: ${esc(p.title)} (key ${p.n})"><span class="n">${p.n}</span><span class="t">${esc(p.title)}</span><span class="track"><i class="fill"></i></span></button>`).join("");
    $$(".part", partsEl).forEach((b) => b.addEventListener("click", () => { closeOver(); goPart(Number(b.dataset.part)); }));
  }
  function paint() {
    const s = steps[cur];
    $("#count").textContent = `${cur + 1} / ${steps.length}`;
    $("#bPrev").disabled = cur === 0;
    $("#bNext").disabled = cur === steps.length - 1;
    $("#bSkip").hidden = !scenes[s.scene].skippable;
    for (const b of $$(".part", partsEl)) {
      const n = Number(b.dataset.part);
      const mine = steps.filter((x) => x.part === n);
      const at = mine.indexOf(s);
      b.classList.toggle("on", n === s.part);
      b.classList.toggle("done", n < s.part);
      $(".fill", b).style.width = n < s.part ? "100%" : n > s.part ? "0%" : `${((at + 1) / mine.length) * 100}%`;
      if (n === s.part) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    }
    document.title = `${s.id} ${s.title} · Platform infrastructure`;
    if (!$("#notes").hidden) paintNotes();
    if (!$("#over").hidden) paintOver();
  }

  // ----- speaker notes -----
  function paintNotes() {
    const s = steps[cur], n = steps[cur + 1];
    $("#notesT").textContent = `${s.id} · ${s.title}`;
    $("#notesNext").textContent = n ? `Next: ${n.id} ${n.title}` : "The last step";
    $("#notesB").innerHTML = s.notes || "<p>No notes for this step.</p>";
  }
  function toggleNotes(on) {
    const box = $("#notes");
    box.hidden = on === undefined ? !box.hidden : !on;
    $("#bNotes").setAttribute("aria-pressed", String(!box.hidden));
    if (!box.hidden) paintNotes();
  }

  // ----- overview -----
  function buildOver() {
    $("#overG").innerHTML = PARTS.map((p) => `<section class="over-p"><h3><small>PART ${p.n}</small>${esc(p.title)}</h3><div class="over-s">${
      steps.map((s, i) => s.part !== p.n ? "" : `<button class="over-c" data-i="${i}"><span class="id">${s.id}</span><span class="tt">${esc(s.title)}</span><span class="kd">${esc(s.kind)}</span></button>`).join("")
    }</div></section>`).join("");
    $$(".over-c").forEach((c) => c.addEventListener("click", () => { closeOver(); go(Number(c.dataset.i)); }));
  }
  function paintOver() {
    $$(".over-c").forEach((c) => {
      const i = Number(c.dataset.i);
      c.classList.toggle("cur", i === cur);
      c.classList.toggle("sel", i === overSel);
    });
  }
  function openOver() {
    overSel = cur;
    $("#over").hidden = false;
    $("#bOver").setAttribute("aria-pressed", "true");
    paintOver();
    const sel = $(`.over-c[data-i="${overSel}"]`);
    if (sel) sel.scrollIntoView({block: "nearest"});
  }
  function closeOver() { $("#over").hidden = true; $("#bOver").setAttribute("aria-pressed", "false"); }
  const toggleOver = () => ($("#over").hidden ? openOver() : closeOver());
  function overKey(e) {
    const k = e.key;
    const cards = $$(".over-c");
    const cols = (() => { // how many cards share the selected card's row
      const sel = cards[overSel]; if (!sel) return 1;
      const top = sel.getBoundingClientRect().top;
      return cards.filter((c) => c.parentElement === sel.parentElement && Math.abs(c.getBoundingClientRect().top - top) < 4).length || 1;
    })();
    if (k === "ArrowRight") overSel = clamp(overSel + 1, 0, steps.length - 1);
    else if (k === "ArrowLeft") overSel = clamp(overSel - 1, 0, steps.length - 1);
    else if (k === "ArrowDown") overSel = clamp(overSel + cols, 0, steps.length - 1);
    else if (k === "ArrowUp") overSel = clamp(overSel - cols, 0, steps.length - 1);
    else if (k === "Home") overSel = 0;
    else if (k === "End") overSel = steps.length - 1;
    else if (k === "Enter" || k === " ") { closeOver(); go(overSel); e.preventDefault(); return; }
    else if (k === "Escape" || k === "o" || k === "O") { closeOver(); return; }
    else return;
    e.preventDefault();
    paintOver();
    cards[overSel].scrollIntoView({block: "nearest"});
  }

  // ----- full screen -----
  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  }
  document.addEventListener("fullscreenchange", () => { $("#bFull").setAttribute("aria-pressed", String(!!document.fullscreenElement)); fit(); });

  // ----- keys: → Space next, ← back, Esc overview, F full screen, N notes, 1-5 the parts -----
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable) return;
    if (!$("#over").hidden) { overKey(e); return; }
    const onControl = t.closest && t.closest("button, a, [role=button]");
    if (e.key === " " && onControl) return;
    if (key(e.key, e.shiftKey)) e.preventDefault();
  });
  // one key, by name: the keydown above, and the keys a frame hands back to the deck
  function key(k, shift) {
    if (k === "ArrowRight" || k === "PageDown" || k === " ") next(shift);
    else if (k === "ArrowLeft" || k === "PageUp") prev();
    else if (k === "Escape" || k === "o" || k === "O") toggleOver();
    else if (k === "f" || k === "F") toggleFull();
    else if (k === "n" || k === "N") toggleNotes();
    else if (k === "Home") go(0);
    else if (k === "End") go(steps.length - 1);
    else if (/^[1-5]$/.test(k)) goPart(Number(k));
    else return false;
    return true;
  }

  // ----- a frame that holds the keys: say so, and take them back on a click of the bar -----
  const chip = $("#keysChip");
  function frameFocus() {
    const inFrame = !!document.activeElement && document.activeElement.tagName === "IFRAME";
    document.body.classList.toggle("in-frame", inFrame);
    chip.hidden = !inFrame;
    if (inFrame) chip.textContent = "The keys drive the frame now · click this bar to give them back to the deck";
  }
  window.addEventListener("blur", () => setTimeout(frameFocus, 0));
  window.addEventListener("focus", () => setTimeout(frameFocus, 0));
  $("#bar").addEventListener("pointerdown", () => {
    if (document.activeElement && document.activeElement.tagName === "IFRAME") { document.activeElement.blur(); window.focus(); setTimeout(frameFocus, 0); }
  });

  function start() {
    buildBar();
    buildOver();
    $("#bPrev").addEventListener("click", prev);
    $("#bNext").addEventListener("click", () => next(false));
    $("#bSkip").addEventListener("click", () => next(true));
    $("#bOver").addEventListener("click", toggleOver);
    $("#bNotes").addEventListener("click", () => toggleNotes());
    $("#notesX").addEventListener("click", () => toggleNotes(false));
    $("#bFull").addEventListener("click", toggleFull);
    new ResizeObserver(fit).observe(stage);
    fit();
    const want = decodeURIComponent(location.hash.slice(1));
    const at = steps.findIndex((s) => s.id === want);
    go(at >= 0 ? at : 0, {instant: true});
    window.addEventListener("hashchange", () => goId(decodeURIComponent(location.hash.slice(1))));
  }

  return {scene, step, go, goId, goPart, next, prev, start, key, toggleNotes, toggleOver, steps, scenes, k: 1, get cur() { return cur; }, get step_() { return steps[cur]; }};
})();

// ----- a full-step frame: loaded on its first show, hidden (so its own clock stops) when the deck is elsewhere -----
function frameScene(id, {src, title, onLoad}) {
  let frame = null;
  Deck.scene(id, {
    kind: "frame",
    build(layer) {
      frame = el(`<iframe title="${esc(title)}" src="${esc(src)}" allow="fullscreen" allowfullscreen loading="eager"></iframe>`);
      layer.append(frame);
      if (onLoad) frame.addEventListener("load", () => onLoad(frame));
    },
    show() {},
    hide() {},
  });
  return () => frame;
}

// ----- Part 4. dev → acc → prd: two full-step frames of the sibling module in part4/ -----
// The module is built separately. The deck talks to it by postMessage only (part4/README.md):
//   from the module: {type: "part4", event: "ready", ok}, {event: "scene-end", scene}, {event: "scene", scene},
//                    {event: "beat", scene}, and {event: "key", key, shiftKey} for a key it does not use itself
//   to the module:   {type: "part4", cmd: "scene", n}, {cmd: "play"}, {cmd: "pause"}, {cmd: "step"}
// A frame that never says "ready" and whose file was missing at build time shows a placeholder.
(() => {
  const LAST_SCENE = 2; // scene 1: straight to main; scene 2: the same change, done properly

  function slot(id, cfg, {title, file, what, drive}) {
    let frame = null, hole = null, layer = null, ready = false, active = false;
    const st = {scene: 1, ended: new Set()};
    const post = (msg) => { if (frame && frame.contentWindow) frame.contentWindow.postMessage(Object.assign({type: "part4"}, msg), "*"); };

    function placeholder(on) {
      if (!on) { if (hole) hole.hidden = true; return; }
      if (!hole) {
        hole = el(`<div class="hole"><div class="hole-c"><span class="eyebrow">Part 4 · placeholder</span><h3>${esc(title)}</h3>
<p>This step shows <code>${esc(file)}</code> in a frame that fills the step: ${what}</p>
<p>The file was not there when the deck was built, and the frame has not answered. Part 4 is built separately, in <code>part4/</code>.</p>
<div class="row"><button data-again>Try again</button><button data-anyway>Show the frame anyway</button></div></div></div>`);
        hole.addEventListener("click", (e) => {
          if (e.target.closest("[data-again]")) { ready = false; frame.src = cfg.src; }
          else if (e.target.closest("[data-anyway]")) placeholder(false);
        });
        layer.append(hole);
      }
      hole.hidden = false;
    }

    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!frame || e.source !== frame.contentWindow || !d || d.type !== "part4") return;
      if (d.event === "ready") {
        // ok: false is the module saying it could not start (its own page says why): nothing to drive
        ready = d.ok !== false;
        placeholder(false);
        if (d.scene) st.scene = Number(d.scene);
        st.ended.clear();
      } else if (d.event === "scene-end") {
        st.scene = Number(d.scene) || st.scene;
        st.ended.add(st.scene);
      } else if (d.event === "scene" || d.event === "beat") {   // a scene chosen or replayed inside the frame
        st.scene = Number(d.scene) || st.scene;
        st.ended.delete(st.scene);
      } else if (d.event === "key") {
        // a key the focused module does not use: → after its last scene leaves part 4; Esc, F, N and the rest go to the deck
        if (!active) return;
        if (d.key === "ArrowRight" || d.key === "PageDown") Deck.next(true);
        else Deck.key(d.key, !!d.shiftKey);
      }
    });

    Deck.scene(id, {
      kind: "frame",
      skippable: !!drive,
      build(l) {
        layer = l;
        frame = el(`<iframe title="${esc(title)}" src="${esc(cfg.src)}" allow="fullscreen" allowfullscreen></iframe>`);
        layer.append(frame);
        if (!cfg.found) placeholder(true);
      },
      show() { active = true; },                                   // the lecturer starts the scene: → or its own Play
      hide() { active = false; if (ready && drive) post({cmd: "pause"}); },
      // →: past part 4 when its last scene has ended; into the next scene when this one has; else one beat of the scene
      onNext: !drive ? null : () => {
        if (!ready) return false;
        if (st.ended.has(st.scene)) {
          if (st.scene >= LAST_SCENE) return false;
          st.scene += 1;
          post({cmd: "scene", n: st.scene});
        }
        post({cmd: "step"});
        return true;
      },
    });
  }

  slot("p4scenes", BUILD.part4.scenes, {

<p>Name the gaps plainly: branch protection or rulesets, an acc target for the platform itself, and bundle validation on pull requests.</p>`,

      const stage = ([n, title, fn, link]) => `<a class="bx stg${n === 6 ? " ghost" : ""}" data-d="s-${n}" href="${U(link)}" target="_blank" rel="noopener"><span class="t"><i class="no">${n}</i>${title}</span><code>${fn}</code></a>`;
      canvas.innerHTML = `
<header class="p5-h"><h2>The LLMOps onboarding, one run</h2><p>Every box opens its code on GitHub ↗</p></header>
<span class="lbl" style="top:68px">Who runs it</span>
<div class="rowx o-act" style="top:94px">${ACTORS.map(([key, icon, title, , sub, link, , w], i) => `${i ? (i === 1 ? `<i class="arr oidc" aria-hidden="true">→</i>` : arrow) : ""}<a class="bx act" style="width:${w}px" data-d="a-${key}" href="${U(link)}" target="_blank" rel="noopener"><span class="t">${icon ? ic(icon) : ""}<code>${title}</code></span><span class="s">${sub}</span></a>`).join("")}</div>
<span class="lbl" style="top:184px">The run, in order</span>
<div class="rowx o-r1" style="top:210px">${STAGES.slice(0, 5).map((s, i) => (i ? arrow : "") + stage(s)).join("")}</div>
<i class="vl" style="left:1282px;top:290px"></i>
<section class="o-steps" style="top:304px">
  <header>${stage(STAGES[5])}<p>for every student, in <code>STEPS</code> order: <b>20 steps</b>, each one <code>ensure_*</code></p></header>
  <div class="o-grid">${STEPS.map(([name, times, what, link]) => `<a class="bx stp" data-d="t-${name}" href="${U(link)}" target="_blank" rel="noopener"><span class="t"><code>${name}</code>${times > 1 ? `<i class="x">× ${times}</i>` : ""}</span><span class="s">${what}</span></a>`).join("")}
    <span class="bx note"><span class="t">${gl("table")}one row each</span><span class="s">in the audit table</span></span></div>
</section>
<i class="vl" style="left:190px;top:522px"></i>
<div class="rowx o-r3" style="top:536px">${STAGES.slice(6).map((s, i) => (i ? arrow : "") + stage(s)).join("")}</div>
<div class="o-state" style="top:630px"><span class="st-t">State in ${L("docs/TECHNICAL-DESIGN.md#L1308-L1406", "<code>course_ops</code>")}:</span>
  ${TABLES.map(([t, n]) => `<span class="tb"><i>${n}</i><code>${t}</code></span>`).join("")}</div>
<div class="o-strip" aria-live="polite"></div>`;
      strip = $(".o-strip", canvas);
      canvas.addEventListener("pointerover", (e) => { const b = e.target.closest("[data-d]"); if (b) say(DETAIL[b.dataset.d]); });
      canvas.addEventListener("focusin", (e) => { const b = e.target.closest("[data-d]"); if (b) say(DETAIL[b.dataset.d]); });
      canvas.addEventListener("pointerout", (e) => { const b = e.target.closest("[data-d]"); if (b && !b.contains(e.relatedTarget)) say(DEFAULTS[beatNow]); });
    },
    show(beat, ctx) {
      beatNow = beat;
      root.dataset.beat = String(beat);
      say(DEFAULTS[beat]);
      const all = $$(".o-act, .o-r1, .o-steps, .o-r3, .o-state, .o-strip, .lbl, .vl", root);
      gsap.killTweensOf([all, $$(".stp", root)]);
      gsap.set([all, $$(".stp", root)], {clearProps: "opacity,visibility,transform"});
      if (!ctx.instant) {
        if (ctx.entered) gsap.from(all, {autoAlpha: 0, y: 18, duration: 0.45, stagger: 0.07, ease: "power2.out", clearProps: "opacity,visibility,transform"});
        if (beat === 1) gsap.from($$(".stp", root), {autoAlpha: 0, scale: 0.8, duration: 0.3, stagger: 0.07, ease: "back.out(1.8)", delay: ctx.entered ? 0.6 : 0.1, clearProps: "opacity,visibility,transform"});
        if (!ctx.entered) gsap.fromTo(strip, {autoAlpha: 0, y: 10}, {autoAlpha: 1, y: 0, duration: 0.4});
      }
      run(beat);
    },
    hide() { if (loop) { loop.kill(); loop = null; } },
  });

  Deck.step({
    part: 5, scene: "onboarding", beat: 0, title: "One run, in order", kind: "drawing, every box a link",
    notes: `<p>This is what makes the nine hundred objects of part 1. <b>Who runs it:</b> the workflow <code>onboarding.yml</code>, every day at 06:00 UTC or by hand, signed in as <code>sp-onboarding-llmops</code> by OIDC. It starts one thin file, <code>src/tasks/onboard.py</code>, which calls <code>run.run</code>, which calls <code>run.onboard</code>.</p>
<p><b>The run:</b> make sure the cohort tables exist, open a run row, the teachers' projects, read the sheet, merge the students into the registry, take every student's open steps, rewrite the identities, reconcile, report, and close the run row in a <code>finally</code>.</p>
<p>Every box is a link to the module and function that does it. Point at one to read it in the strip at the bottom.</p>`,
  });
  Deck.step({
    part: 5, scene: "onboarding", beat: 1, title: "Twenty steps per student", kind: "the steps, lit in order",
    notes: `<p>The heart of the run: for every student, the open steps of their plan, in the order of <code>STEPS</code>. User, usage policy, the three schemas, the warehouse, the experiments, the repository; then three deploy principals, the invitations, the first deploys to dev and acc, the Lakebase databases, the credentials, the course materials, Discord. Twenty names in all.</p>
<p>Each step is one <code>ensure_*</code> function and writes one row to <code>audit.onboarding_steps</code>. A failed step holds only the steps that depend on it, for that run; tomorrow's run takes them again. <code>prd</code> is never deployed by the run: it waits for the student's approval.</p>`,
  });
  Deck.step({
    part: 5, scene: "onboarding", beat: 2, title: "Why a second run is safe", kind: "the close",
    notes: `<p>The run is idempotent, step by step. Each <code>ensure_*</code> looks the object up by name first and creates only what is missing, so a second run changes nothing and only reports what is still pending.</p>
<p>The state is in the <code>course_ops</code> tables, never in the repository: the registry says who and what exists, the audit says what the system did. Removals are planned and printed, and nothing is removed until the cohort file says <code>apply</code>; today it says <code>report</code>.</p>
<p>Close the loop to part 1: this is why a banned workspace could be rebuilt in a day. And to part 4: the platform's own repository has the tests and the dry runs, but not yet the gates.</p>`,
  });
})();

// ----- start: say so when the CDN did not answer, else open the deck -----
if (!window.gsap) {
  const fatal = $("#fatal");
  fatal.innerHTML = `<div><b>The deck could not load GSAP ${esc(BUILD.gsap || "")} from the CDN.</b><br>It needs the network when it opens. For a room without internet, open <code>index.bundled.html</code> (made by <code>src/build.py --bundle</code>).</div>`;
  fatal.hidden = false;
} else {
  Deck.start();
  window.__deck = Deck; // a hook for src/verify.py, not used by the deck itself
}

})();
</script>
</body>
