<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part 4 harness</title>
<style>
  /* A stand-in for the deck: one iframe that fills the window under a thin bar, the commands the
     deck may send, and a log of what the page posts back. Open it from src/:
       harness.html                    the animation
       harness.html?page=github.html   the close-up
       harness.html?hidden=1           the iframe starts hidden and is shown after 1.5 s */
  html,body{margin:0;height:100%;font:14px/1.3 system-ui,sans-serif;background:#1a1a1a;color:#eee}
  body{display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;gap:6px;padding:5px 8px;height:34px;box-sizing:border-box}
  button{font:inherit;padding:2px 10px;border-radius:999px;border:1px solid #555;background:#2a2a2a;color:#eee;cursor:pointer}
  #log{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,monospace;font-size:12px;color:#9fd8b4;direction:rtl;text-align:left}
  iframe{flex:1 1 0;min-height:0;width:100%;border:0;background:#fff}
</style>
</head>
<body>
<div class="bar">
  <button data-cmd='{"cmd":"scene","n":1}'>scene 1</button>
  <button data-cmd='{"cmd":"scene","n":2}'>scene 2</button>
  <button data-cmd='{"cmd":"play"}'>play</button>
  <button data-cmd='{"cmd":"pause"}'>pause</button>
  <button data-cmd='{"cmd":"step"}'>step</button>
  <span id="log">waiting for ready…</span>
</div>
<iframe id="f" title="Part 4" allow="fullscreen"></iframe>
<script>
  const q = new URLSearchParams(location.search), f = document.getElementById("f");
  window.__log = [];
  window.send = (msg) => f.contentWindow.postMessage({type: "part4", ...msg}, "*");
  window.addEventListener("message", (e) => {
    if (e.source !== f.contentWindow || !e.data || e.data.type !== "part4") return;
    window.__log.push(e.data);
    document.getElementById("log").textContent = window.__log.slice(-4).map((m) => JSON.stringify(m)).join("  ");
  });
  document.querySelectorAll("[data-cmd]").forEach((b) => (b.onclick = () => window.send(JSON.parse(b.dataset.cmd))));
  if (q.get("hidden")) { f.style.display = "none"; setTimeout(() => (f.style.display = ""), 1500); }
  f.src = "../" + (/^[a-z.]+\.html$/.test(q.get("page") || "") ? q.get("page") : "index.html");
</script>
</body>
</html>
