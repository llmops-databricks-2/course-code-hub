body{background:#f7f3ec;color:var(--body);font:1rem/1.45 "Nunito",system-ui,sans-serif;overflow:hidden}
button,select,input{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:.3rem .95rem;font-size:1rem;font-weight:500;white-space:nowrap;line-height:1.3}
button:hover{background:var(--alt)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
button.primary:hover{background:#333}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--link);outline-offset:2px}
code,.mono{font-family:"Fira Code",ui-monospace,monospace;font-size:.94em;font-variant-ligatures:none}
a{color:var(--link)}
/* The animation page: a caption strip, the stage, a transport bar. The page is the height of its
   iframe; the stage takes what the two strips leave. */
body{display:flex;flex-direction:column}
.cap{flex:none;display:flex;align-items:stretch;gap:1rem;padding:.4rem .75rem;background:var(--panel);border-bottom:1px solid var(--line);height:4rem}
.tabs{flex:none;display:flex;flex-direction:column;justify-content:center;gap:.2rem}
.tabs button{border-radius:.5rem;padding:.02rem .7rem;text-align:left;font-size:1rem;line-height:1.35;color:var(--body);background:none;border-color:transparent}
.tabs button:hover{background:var(--alt)}
.tabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:600}
.tabs button b{font-family:"Fira Code",ui-monospace,monospace;font-weight:500;margin-right:.45rem}
.cap-b{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:.75rem;border-left:1px solid var(--line-soft);padding-left:1rem}
.cap-n{flex:none;font:500 1rem "Fira Code",ui-monospace,monospace;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:.1rem .7rem;white-space:nowrap}
.cap-b p{margin:0;font-size:1rem;line-height:1.38;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap-b p b{color:var(--ink);font-weight:600;font-size:1.06rem;margin-right:.3rem}

.stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:#f7f3ec;outline-offset:-2px}
#sv{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.hud-err{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--no);color:var(--ink);border-radius:12px;padding:1.1rem 1.4rem;max-width:32rem;font-size:1rem}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.25rem;font-weight:600;padding:.7rem 1.7rem;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 30px rgba(26,26,26,.25)}
.bigplay:hover{background:#333}
.bigplay[hidden]{display:none}

.bar{flex:none;display:flex;align-items:center;gap:.5rem;padding:0 .75rem;background:var(--panel);border-top:1px solid var(--line);height:3rem}
.bar .sep{width:1px;height:1.4rem;background:var(--line);margin:0 .25rem}
.bar .grow{flex:1 1 0}
#bPlay{min-width:6.6rem}
.dots{display:flex;gap:.3rem;align-items:center}
.dots button{width:1.75rem;height:1.75rem;padding:0;border-radius:50%;font:500 1rem "Fira Code",ui-monospace,monospace;color:var(--body);display:grid;place-items:center}
.dots button.past{background:#e7e4de;border-color:#d5d1c9;color:var(--ink)}
.dots button.now{background:var(--flame);border-color:var(--flame);color:#fff}
.speed{display:inline-flex;align-items:center;gap:.4rem;font-size:1rem;color:var(--body);white-space:nowrap}
.speed input{width:6.5rem;accent-color:var(--ink);margin:0}
.speed output{font:500 1rem "Fira Code",ui-monospace,monospace;color:var(--ink);min-width:3.2em}
.hint{font-size:1rem;color:var(--muted);white-space:nowrap}
kbd{font:500 .9rem "Fira Code",ui-monospace,monospace;color:var(--ink);background:var(--alt);border:1px solid var(--line);border-radius:5px;padding:0 .3rem}
@media (max-width:1180px){.hint{display:none}}

/* ---------- the drawing ---------- */
#sv text{font-family:"Nunito",system-ui,sans-serif;fill:var(--ink);font-size:17px}
#sv .mono{font-family:"Fira Code",ui-monospace,monospace;font-size:16px;font-weight:500;font-variant-ligatures:none}
#sv .b{font-weight:600}
#sv .sans{font-family:"Nunito",system-ui,sans-serif;font-weight:500}
#sv .zl{font-size:16.5px;font-weight:600;letter-spacing:.08em;fill:#3a4a66}
#sv .zs{font-size:16px;font-weight:500;fill:#5b6a85}
#sv .tt{font-size:17px;font-weight:600}
#sv .tt.big{font-size:19px}
#sv .ts{font-size:16.5px;fill:#5d5d5d}
#sv .ink{fill:var(--ink)}
#sv .ok{fill:var(--ink-ok)} #sv .no{fill:var(--ink-no)} #sv .dev{fill:#a8503f} #sv .user{fill:#54489a}
#sv .pn{font-size:18px;font-weight:600}

.zone .zr{stroke-width:1.5}
.z-dbx .zr{fill:rgba(80,111,160,.16);stroke:rgba(80,111,160,.62);stroke-width:2.2}
.z-plane .zr{fill:rgba(80,111,160,.10);stroke:rgba(80,111,160,.34)}
.z-store .zr{fill:rgba(78,117,102,.17);stroke:rgba(78,117,102,.45)}
#sv .z-store .zl{fill:#3c5c50} #sv .z-store .zs{fill:#4e7566}
.z-ghost .zr{fill:rgba(255,255,255,.2);stroke:rgba(80,111,160,.62);stroke-width:2;stroke-dasharray:9 7}
.z-res .zr{stroke:rgba(78,117,102,.7)}
#sv .gh-t{font-size:16.5px;font-weight:600;letter-spacing:.08em;fill:#3a4a66}
#sv .z-res .gh-t{fill:#3c5c50}
.z-devs .zr{fill:rgba(255,255,255,.5);stroke:rgba(138,117,86,.34)}
#sv .z-devs .zl,#sv .z-gh .zl{fill:#6a5a40}
#sv .z-gh .zs{fill:#8a7556}
.gh-out{fill:none;stroke:#b9b4ab;stroke-width:3.5}
.gh-in{fill:#eef0f4}
.cell{fill:rgba(255,255,255,.46);stroke:rgba(80,111,160,.3);stroke-width:1.2}
.lh{fill:#fff;stroke:#c9d2e2;stroke-width:1.2}
#sv .lh-t{font-size:17px}
.vtag{fill:#eeece8;stroke:#d5d1c9}
.vtag.v-new{fill:#e3f3ea;stroke:var(--ok)}
#sv .vt{fill:#6b6b6b} #sv .vt.v-new{fill:var(--ink-ok);font-weight:600}

.sh1{fill:#1a1a1a;opacity:.08}
.face{fill:url(#gTile);stroke:#d9d6d1;stroke-width:1.5}
.face-no{fill:#fbe9e7;stroke:var(--no);stroke-width:2.5}
.plate{fill:#f4f2ee;stroke:#e6e3de}
.stepb circle{fill:var(--ink)}
#sv .stepb text{fill:#fff;font-size:16px;font-weight:600;text-anchor:middle}

/* rails */
.rail{fill:none;stroke-linecap:round;stroke-linejoin:round}
.r-lane{stroke:#c9c3b8;stroke-width:6}
.r-lane-c{stroke:#fbfaf7;stroke-width:1.8}
.r-stub{stroke:#b9bdc9;stroke-width:3}

/* what an environment holds */
.dbar{fill:#6b5fb0;opacity:.78}
.axis{stroke:#9aa3b5;stroke-width:1.5}
.trend{fill:none;stroke:var(--ok);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.crack{fill:none;stroke:var(--no);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ui-l{stroke:#d5d2cc;stroke-width:5;stroke-linecap:round}
.gr{fill:#fff;stroke:#e0cf9f;stroke-width:1.5}
.gr-no{fill:#fbe9e7;stroke:var(--no);stroke-dasharray:6 4}
.cab{fill:url(#gCab)}
.blade{fill:#4a5369;stroke:#5c6781}
.led{fill:#77819a}
.vent{stroke:#333a4b;stroke-width:2;stroke-linecap:round}
.cyl{fill:url(#gCyl);stroke:#7fa091;stroke-width:1.5}
.cyl-top{fill:#eef5f1;stroke:#7fa091;stroke-width:1.5}
.cyl-row{fill:none;stroke:#9fb8ad;stroke-width:1.2}
.cyl-ghost{fill:none;stroke:var(--no);stroke-width:1.5;stroke-dasharray:5 4;opacity:.75}
.would{fill:rgba(214,69,69,.08);stroke:var(--no);stroke-width:2.5;stroke-dasharray:8 5}

/* GitHub */
.g-main{stroke:#3d4350;stroke-width:4;stroke-linecap:round}
.g-dot{stroke:#fff;stroke-width:2.5}
.skip{fill:rgba(255,255,255,.6);stroke:#b9b4ab;stroke-width:1.5;stroke-dasharray:6 4}
.skip-x{fill:none;stroke:#9a958c;stroke-width:2.6;stroke-linecap:round}
.chip{fill:#f4f2ee;stroke:#d9d6d1;stroke-width:1.5}
.arrow{fill:none;stroke:#9a9a9a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plan{fill:#fff;stroke:#3d4350;stroke-width:2}
.plan-seam{stroke:#fff;stroke-width:3}
.plan-bad{fill:#fbe9e7}

/* people */
.desk-top{fill:url(#gDesk)} .desk-front{fill:#d9c9ad} .desk-leg{fill:#c9b896} .desk-panel{fill:#e6d9bf}
.arm{fill:none;stroke-width:11.5;stroke-linecap:round;stroke-linejoin:round}
.arm-sh{stroke:#1a1a1a;stroke-width:13.5;opacity:.13}
.specs{fill:rgba(255,255,255,.4);stroke:#3a3f4a;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.mug{fill:#fff;stroke:#c9c3b8;stroke-width:1.2} .mug-h{fill:none;stroke:#c9c3b8;stroke-width:2.2;stroke-linecap:round}
.lead{stroke:#b9bdc9;stroke-width:3;stroke-linecap:round}
.lap-base{fill:#dfe3ea;stroke:#aab1bf;stroke-width:1} .lap-side{fill:#b6bdca} .lap-key{fill:#b9c0cd}
.lap-lid{fill:#2f333c} .lap-edge{fill:#1f2228}
.lap-scr{fill:url(#gScr)}
.glow{opacity:.5}

/* packets, verdicts, bubbles */
.pk-disc{stroke:#fff;stroke-width:2.2}
.vd-disc{stroke:#fff;stroke-width:2.5}
.vd-mark{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.vd-tag{fill:#fff;stroke-width:2}
#sv .vd-t{font-size:17px;font-weight:600}
.bub{fill:#fff;stroke:#3d4350;stroke-width:2}
.bub.good{stroke:var(--ok)} .bub.bad{stroke:var(--no);fill:#fff6f5}
.bub-seam{stroke:#fff;stroke-width:3;stroke-linecap:butt}
.bub-seam.bad{stroke:#fff6f5}
#sv .bub-t{font-size:17px;font-weight:600}
#sv .bub-t.bad{fill:var(--ink-no)}
#sv .stamp-t{font-size:30px;font-weight:600;letter-spacing:.06em}

</style>
</head>

  <div class="hud-err" id="err" hidden></div>
</main>

  </label>

</footer>

<script>
(() => {
"use strict";
// Part 4 of the platform lecture: "dev → acc → prd for infrastructure", two animated scenes.
// The drawing language is the one of lecture_materials/day-on-the-platform (developers on the
// left, GitHub below them, your Databricks account in the middle, the platform users on the right;
// white tiles with depth, packets that fly along rails, verdict discs), redrawn here for a stage
// that is always whole on screen: a world 1280 units wide and 580 to 740 high, so one unit is at
// least one CSS pixel on a 1280-wide screen and every label is 16 units or more.
//
// The files of src/js are concatenated in name order into one function scope by build.py:
// 00-core (helpers), 05-people (the figures), 10-world (the drawing, laid out for a height),
// 20-engine (the scene clock, packets, verdicts, bubbles, effects), 30-scene1 and 35-scene2 (the
// two stories, beat by beat), 40-ui (controls, keys, the postMessage protocol).
//
// One clock: every motion of a scene is a child of one paused GSAP timeline, built whole before it
// plays. Nothing is changed from a callback, so the timeline can be paused, stepped, sought back
// and rebuilt for another stage height at the same second.

const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const post = (msg) => { if (window.parent !== window) window.parent.postMessage({type: "part4", page: "index", ...msg}, "*"); };
if (!window.gsap || !window.MotionPathPlugin) {
  // the CDN did not answer: say so instead of showing an empty stage
  const b = $("err");
  b.hidden = false;
  b.textContent = "This page loads GSAP from cdnjs.cloudflare.com and could not reach it. Open it with a network connection, or use index.bundled.html, which carries everything.";
  post({event: "ready", ok: false});
  return;
}
gsap.registerPlugin(MotionPathPlugin);
const svg = $("sv"), stage = $("stage");
const W = 1280, HMIN = 580, HMAX = 740;
const FAM = {dev: "#c9705f", token: "#d9a441", user: "#6b5fb0", plat: "#506fa0", data: "#4e7566", ok: "#3f9b6b", no: "#d64545"};
const INK_OK = "#1f6b46", INK_NO = "#a12b2b";

const el = (tag, attrs, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const txt = (x, y, s, cls, parent, attrs = {}) => {
  // a fill is set as a style: a fill attribute would lose to the stylesheet's rule for text
  const {fill, ...rest} = attrs;
  const t = el("text", {x, y, class: cls, ...rest}, parent);
  if (fill) t.style.fill = fill;
  t.textContent = s;
  return t;
};
const use = (id, x, y, size, parent, attrs = {}) => el("use", {href: "#" + id, x, y, width: size, height: size, ...attrs}, parent);

// text is measured on a canvas, not in the SVG: the page may be built while its iframe is hidden,
// and a hidden SVG measures every text as zero
const meas = document.createElement("canvas").getContext("2d");
const textW = (s, font) => { meas.font = font; return meas.measureText(s).width; };
const F = {
  body: '500 17px "Nunito", system-ui, sans-serif',
  bold: '600 17px "Nunito", system-ui, sans-serif',
  mono: '500 16px "Fira Code", ui-monospace, monospace',
};

// an orthogonal polyline's length, and its points as GSAP wants them
const pathLen = (pts) => pts.reduce((n, p, i) => (i ? n + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0), 0);
const rev = (pts) => pts.slice().reverse();
const polyD = (pts) => "M" + pts.map((p) => p[0] + " " + p[1]).join("L");

// ---------- the people ----------
// Copied from lecture_materials/day-on-the-platform/src/js/05-people.js and the vignette of its
// 10-world.js (drawn for that page, from no illustration pack), so both pages show the same
// people at the same desks. Added here: a tint over the laptop's screen, for the red of a refused
// request, and avatar(), a bust in a disc for the reviewer. The developer of this scene is
// Victor, drawn here for this page: short hair with a sideburn, broad shoulders, a shirt with a
// collar, in the warm colour of developer traffic.
// Eight calm, flat figures, drawn here and taken from no illustration pack: a head shape with hair,
// shoulders, two arms. No eyes and no mouth: the turn of the head towards the laptop says enough.
// The coordinates are the vignette's (10-world.js): the desk's back edge is y = 84 and the laptop
// stands on the right, so everyone is drawn turned to the right; the users' column mirrors them.
// Clothing: the developers wear the warm family of their traffic, the users the violet one.
const LOOK = {
  victor: {skin: "#e8b89a", hair: "#3b2a20", style: "short", shirt: "#c9705f", collar: "#a8503f", pose: "type", build: "broad"},
  bo: {skin: "#a9714b", hair: "#241a14", style: "crop", shirt: "#dcae5a", pose: "mug", glasses: true},
  chen: {skin: "#f0c9a8", hair: "#1f1a18", style: "side", shirt: "#a8766a", pose: "chin"},
  dana: {skin: "#7a4a32", hair: "#2a1c16", style: "curls", shirt: "#6b5fb0", pose: "type"},
  eli: {skin: "#f1cdb0", hair: "#9a5a38", style: "crop", shirt: "#8f84c7", pose: "chin", beard: true},
  fay: {skin: "#c98f6b", hair: "#3a2619", style: "bob", shirt: "#57508f", pose: "type", glasses: true},
  gus: {skin: "#e2ad8c", hair: "#b98a54", style: "quiff", shirt: "#7d8fc4", pose: "mug"},
  tess: {skin: "#f3d6c0", hair: "#b5b1ab", style: "long", shirt: "#a7a0d8", pose: "type"},
};
// the head is an ellipse centred on (75, 28), 15 wide and 17 high, and each style is a cap over it;
// HEAD then enlarges head and hair together, so the figures read as people, not as mannequins
const HEAD = "translate(75 30) scale(1.14) translate(-75 -28)";
const CAP = "M60 32C57.5 15 66 8.5 76 9C85 9.5 91 15 90.8 23C86.5 18.5 80 16.5 73 18C67.5 19.5 64.5 25 64.5 32Z";
const FRINGE = "M59 31C56 12 67 6.5 78 7.5C88.5 8.5 93 16 91.5 24C86 21.5 81 18.5 75 18C70 18.5 67.5 23 67 31Z";
const HAIR = {
  crop: {front: (g, c) => el("path", {d: CAP, fill: c}, g)},
  short: {front: (g, c) => { el("path", {d: CAP, fill: c}, g); el("path", {d: "M66.3 29.5h3.2v5.6c-1.9.2-3.2-1-3.2-2.9z", fill: c}, g); }},
  bun: {front: (g, c) => { el("circle", {cx: 61, cy: 10.5, r: 7, fill: c}, g); el("path", {d: CAP, fill: c}, g); }},
  side: {front: (g, c) => el("path", {d: "M60 32C56.5 13 67 6.5 78 7.5C88.5 8.5 93.5 16 91.5 26C87 21.5 81 20 74.5 20.5C68.5 21 65 26 64.5 32Z", fill: c}, g)},
  quiff: {front: (g, c) => { el("path", {d: CAP, fill: c}, g); el("ellipse", {cx: 81, cy: 11.5, rx: 10, ry: 6, transform: "rotate(-10 81 11.5)", fill: c}, g); }},
  bob: {front: (g, c) => el("path", {d: "M59.5 30C56 12 67 6.5 78 7.5C88.5 8.5 93 16 91.5 24C86 21.5 81 18.5 75 18C70 18.5 67.5 23 67 29C66.8 36 66.5 42 64.5 47.5C60 48.5 56.5 45 57 40C58 37 59 34 59.5 30Z", fill: c}, g)},
  long: {
    back: (g, c) => el("path", {d: "M58.5 26C56.5 38 55.5 45 53.5 51C52.5 55 55 58 59 58H66.5C68 51 68.5 42 67.5 32Z", fill: c}, g),
    front: (g, c) => el("path", {d: FRINGE, fill: c}, g),
  },
  curls: {
    back: (g, c) => [[58.5, 40, 8.5], [60, 48, 6.5]].forEach(([cx, cy, r]) => el("circle", {cx, cy, r, fill: c}, g)),
    front: (g, c) => [[61, 21, 9.5], [66, 13, 9], [75, 9.5, 9], [84, 11, 8.5], [90, 17, 6.5], [57.5, 30.5, 8]].forEach(([cx, cy, r]) => el("circle", {cx, cy, r, fill: c}, g)),
  },
};
// the person's upper body, drawn before the desk, which hides the rest; returns the head, which nods
const personBust = (g, who) => {
  const k = LOOK[who], hair = HAIR[k.style];
  if (hair.back) hair.back(el("g", {transform: HEAD}, g), k.hair);
  const broad = k.build === "broad";
  el("path", {d: broad ? "M31 92C31 73 39 62.5 55 59.5L66.5 57H83.5L96 59.5C109 62.5 115 73 115 92Z" : "M38 92C38 75 44 64.5 57 61.5L67 59H83L91 61.5C102 64.5 108 75 108 92Z", fill: k.shirt}, g);
  el("rect", broad ? {x: 67.8, y: 44, width: 14.4, height: 19, rx: 6.5, fill: k.skin} : {x: 69.5, y: 44, width: 11, height: 18, rx: 5.5, fill: k.skin}, g);
  if (k.collar) el("path", {d: "M66.5 57l8.5 9.5l-5.2 4.2l-6.3-10.5zM83.5 57l-8.5 9.5l5.2 4.2l6.3-10.5z", fill: k.collar}, g);
  const nod = el("g", {}, g), head = el("g", {transform: HEAD}, nod);

// ---------- the drawing ----------
// The ground says where a part runs, as in Databricks' own architecture picture
// (https://docs.databricks.com/aws/en/getting-started/high-level-architecture). Outside, on the
// warm page: the developer, GitHub and the platform users. Your Databricks account: one perimeter
// that holds the control plane, the serverless compute plane and default storage. Under it,
// outside it, dashed and empty: your cloud account and your resources, which a serverless
// workspace does not have. No cloud-provider frame wraps the Databricks account.
//
// Inside the account the planes are rows and the environments are columns. The control plane's
// tiles stand in the order every request meets them: (1) the front door, (2) identity and auth,
// (3) the two authorizers, Unity Catalog for data and AI assets and workspace ACLs for workspace
// objects. Under them, each environment holds a dashboard (a workspace object), its grants (Unity
// Catalog's privileges), a SQL warehouse (serverless compute) and its tables (default storage):
// top to bottom is the order a request touches them.
//
// buildWorld(n, H) draws the world of scene n for a stage H units high and returns its geometry.

  [[300, "YOUR CLOUD ACCOUNT", ""], [646, "YOUR RESOURCES", "z-res"]].forEach(([x, label, cls]) => {

    [["dev", 34], ["acc", 102], ["prd", 214]].forEach(([k, x]) => {

  // ----- the platform users -----

    const y0 = 44 + i * hb, vy = y0 + hb - 118, g = el("g", {}, L.ppl);

  // ----- the rails: one way in from each side, then door, auth, authorizers, bus, lanes -----
  const RY = G.RAIL_Y, BUS = G.BUS;
  const rail = (pts, cls = "r-lane") => { el("path", {d: polyD(pts), class: "rail " + cls}, L.rail); if (cls === "r-lane") el("path", {d: polyD(pts), class: "rail r-lane-c"}, L.rail); };
  G.pIn = [[293, RY], [515, RY]];                               // from GitHub to the front door
  G.pTrunk = (from) => [from, [293, from[1]], [293, RY], [515, RY]];
  rail(G.pTrunk(gh.out));
  if (gh.ciOut) rail([gh.ciOut, [293, gh.ciOut[1]]], "r-stub");
  const lastLead = G.users[2].lead[1];

  G.pUser = (u) => [u.lead, [987, u.lead[1]], [987, RY], [765, RY]];

    [s.dash, s.grant, s.rack, s.tab].forEach((o) => rail([[s.gx, o.cy], [s.x, o.cy]], "r-stub"));

  // the ways inside: door -> auth -> an authorizer -> down a lane's gutter to an object
  G.pDoorAuth = (side) => [[side === "L" ? 515 : 765, RY], [640, RY], [640, 118]];

  G.cross = {L: [300, RY], R: [980, RY]};
  G.mid = [640, (pT + sB) / 2];
  G.planTop = yDash - 2;
  return G;
}

// ---------- the engine: the scene clock and what is placed on it ----------
// tl is the scene clock, a paused GSAP timeline. Every helper below takes the second at which its
// motion starts and adds tweens at that second; it returns the second at which it ends. Nothing
// here runs a callback that changes the drawing, so the clock can be sought to any second.

let tl = null, G = null, beats = [];
const SPEED = 540;                       // units per second of a packet at 1×
let seed = 1;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };   // the same flicker on every build

const beat = (t, title, text) => { beats.push({t, title, text}); return t; };

// the seconds at which a packet at `speed` passes each point of a polyline
const times = (t, pts, speed = SPEED) => { let d = 0; return pts.map((p, i) => (i ? (d += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1])) : 0, t + d / speed)); };
const dedupe = (pts) => pts.filter((p, i) => !i || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]);

// a packet: a disc with a halo, flown along a polyline at a steady speed
const fly = (t, pts, o = {}) => {
  pts = dedupe(pts);
  const col = o.col || FAM.user, r = o.r || 6.5;
  const g = el("g", {opacity: 0}, L.pk);
  el("circle", {r: r + 4.5, fill: col, opacity: 0.22}, g);
  el("circle", {r, fill: col, class: "pk-disc"}, g);
  gsap.set(g, {x: pts[0][0], y: pts[0][1]});
  const dur = pathLen(pts) / (o.speed || SPEED);
  tl.set(g, {opacity: 1}, t);
  if (pts.length === 2) tl.to(g, {x: pts[1][0], y: pts[1][1], duration: dur, ease: "none"}, t);
  else tl.to(g, {motionPath: {path: pts.slice(1).map(([x, y]) => ({x, y})), curviness: 0}, duration: dur, ease: "none"}, t);
  tl.to(g, {opacity: 0, duration: 0.12}, t + dur);
  return t + dur;
};

// a ring that opens where something happens
const ring = (t, x, y, col, r0 = 8, r1 = 26) => {
  const c = el("circle", {cx: x, cy: y, r: r0, fill: "none", stroke: col, "stroke-width": 3, opacity: 0}, L.fx);
  tl.set(c, {opacity: 0.9}, t);
  tl.to(c, {attr: {r: r1}, opacity: 0, duration: 0.6, ease: "power2.out"}, t);
};

// a tile's border lights for a moment
const pulse = (t, o, col = FAM.plat, d = 0.5) => {
  tl.to(o.face, {stroke: col, strokeWidth: 3, duration: 0.1}, t);
  tl.to(o.face, {stroke: "#d9d6d1", strokeWidth: 1.5, duration: 0.3}, t + d);
};
const shake = (t, target, amp = 4) => {
  tl.to(target, {x: amp, duration: 0.05, ease: "none"}, t);
  tl.to(target, {x: -amp, duration: 0.07, yoyo: true, repeat: 4, ease: "none"}, t + 0.05);
  tl.to(target, {x: 0, duration: 0.05, ease: "none"}, t + 0.4);
};

// a verdict: the visible moment of a check. A disc with a tick or a cross, a ring, a tag.
// The disc sits on the tile's top edge, near its right corner; the tag stands above the tile, its
// right edge on the disc's (dy moves it: the tags of identity and auth and of the two authorizers
// hang under their tiles, clear of the front door and of the plane's label). hold: seconds before
// it fades (Infinity: it stays)
const verdict = (t, x, y, ok, text, o = {}) => {
  const col = ok ? FAM.ok : FAM.no, r = o.r || 11.5;
  const g = el("g", {transform: `translate(${x},${y})`}, L.top);
  const rg = el("circle", {r, fill: "none", stroke: col, "stroke-width": 3, opacity: 0}, g);
  let tag = null;
  if (text) {
    const w = textW(text, F.bold) + 24, dy = o.dy == null ? -27 : o.dy;
    tag = el("g", {opacity: 0}, g);
    el("rect", {x: r - w, y: dy - 14, width: w, height: 28, rx: 14, class: "vd-tag", stroke: col}, tag);
    txt(r - w / 2, dy + 6, text, "vd-t", tag, {"text-anchor": "middle", fill: ok ? INK_OK : INK_NO});
  }
  const inner = el("g", {}, g);
  el("circle", {r, fill: col, class: "vd-disc"}, inner);
  el("path", {d: ok ? "M-5 0l3.5 4.2l6.8-8.4" : "M-4.5-4.5l9 9M4.5-4.5l-9 9", class: "vd-mark"}, inner);
  gsap.set(inner, {scale: 0, svgOrigin: "0 0"});
  tl.to(inner, {scale: 1, duration: 0.32, ease: "back.out(2.6)"}, t);
  tl.set(rg, {opacity: 0.9}, t + 0.05);
  tl.to(rg, {attr: {r: r * 2.7}, opacity: 0, duration: 0.7, ease: "power2.out"}, t + 0.05);
  if (tag) tl.to(tag, {opacity: 1, duration: 0.22}, t + 0.08);
  const hold = o.hold == null ? 1.25 : o.hold;
  if (hold !== Infinity) tl.to(g, {opacity: 0, duration: 0.28}, t + hold);
  return t + (o.wait == null ? 0.3 : o.wait);
};
const corner = (o) => [o.x + o.w - 22, o.y];

// a state disc or any small thing that pops in, and out
const hidden = (...nodes) => nodes.forEach((n) => gsap.set(n, {scale: 0, svgOrigin: "0 0"}));
const pop = (t, node) => tl.to(node, {scale: 1, duration: 0.3, ease: "back.out(2.4)"}, t);
const unpop = (t, node) => tl.to(node, {scale: 0, duration: 0.16, ease: "power1.in"}, t);
const fade = (t, node, to, d = 0.22) => tl.to(node, {opacity: to, duration: d}, t);
const swap = (t, from, to) => { fade(t, from, 0, 0.15); fade(t + 0.12, to, 1, 0.2); };
const turn = (t, node, secs) => tl.to(node, {rotation: "+=" + 360 * Math.max(1, Math.round(secs / 0.9)), duration: secs, ease: "none", svgOrigin: "0 0"}, t);

// ----- bubbles: what a person says, or thinks -----
// at: the bubble's top corner on the side it is aligned to (with o.bottom, at[1] is the highest it
// may start and the bubble stands on o.bottom); to: the head it belongs to
const bubble = (at, lines, o = {}) => {
  const w = Math.max(...lines.map((l) => textW(l, F.bold))) + 28, h = lines.length * 21 + 15;
  const x = o.align === "L" ? at[0] : at[0] - w, y = o.bottom == null ? at[1] : Math.max(at[1], o.bottom - h);
  const g = el("g", {}, L.top), inner = el("g", {}, g), [hx, hy] = o.to;
  const cls = "bub " + (o.cls || "");
  const ax = Math.min(x + w - 18, Math.max(x + 18, hx));
  el("rect", {x: x + 1, y: y + 3, width: w - 2, height: h, rx: 15, class: "sh1"}, inner);
  if (o.think) {
    const bx = hx < x ? x + 14 : ax, by = y + h;
    [[0.4, 5.5], [0.8, 3.6]].forEach(([f, r]) => el("circle", {cx: bx + (hx - bx) * f, cy: by + 3 + (hy - by - 3) * f, r, class: cls}, inner));
  } else {
    const tip = Math.min(y + h + 11, Math.max(y + h + 5, hy - 2));
    el("path", {d: `M${ax - 8} ${y + h - 2}L${ax + (hx - ax) * 0.3} ${tip}L${ax + 8} ${y + h - 2}Z`, class: cls + " tail"}, inner);
  }
  el("rect", {x, y, width: w, height: h, rx: 14, class: cls}, inner);
  if (!o.think) el("path", {d: `M${ax - 7} ${y + h - 0.6}h14`, class: "bub-seam " + (o.cls || "")}, inner);
  lines.forEach((l, i) => txt(x + w / 2, y + 27 + i * 21, l, "bub-t " + (o.cls || ""), inner, {"text-anchor": "middle"}));
  gsap.set(inner, {opacity: 0, scale: 0.7, svgOrigin: `${ax} ${y + h}`});
  return {g: inner, x, y, w, h};
};
const bshow = (t, b) => tl.to(b.g, {opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.8)"}, t);
const bhide = (t, b) => tl.to(b.g, {opacity: 0, scale: 0.85, duration: 0.18}, t);
const say = (t, b, hold) => { bshow(t, b); bhide(t + hold, b); };
// a bubble of one of the users, above their head
const ubub = (u, lines, cls) => bubble([1258, u.top], lines, {to: u.head, bottom: u.head[1] - 13, cls});
// the developer's thought: above his head where the stage is tall enough, else to the right of it
const think = (lines, cls) => bubble(G.dev.head[1] >= 124 ? [282, 42] : [298, 14], lines, {to: G.dev.head, think: true, cls});

// ----- what a laptop shows -----
const flash = (t, p) => { tl.to(p.flash, {opacity: 0.85, duration: 0.08}, t); tl.to(p.flash, {opacity: 0, duration: 0.35}, t + 0.1); };
const nod = (t, p) => tl.to(p.bust, {y: -3.5, duration: 0.14, yoyo: true, repeat: 1, ease: "power1.out"}, t);
const typing = (t, p, secs) => { for (let i = 0; i < secs / 0.45; i++) flash(t + i * 0.45, p); };

// ----- what happens to the things of an environment -----
const lightRack = (t, r, d = 0.9) => r.blades.forEach((b, i) => { fade(t + i * 0.07, b.lit, 1, 0.1); fade(t + d + i * 0.05, b.lit, 0, 0.25); });
const hitTables = (t, tb) => tb.cyls.forEach((c, i) => { fade(t + i * 0.06, c.hit, 1, 0.1); fade(t + 0.5 + i * 0.06, c.hit, 0, 0.3); });
const star = (t, x, y, s = 1, col = FAM.token) => {
  const g = el("g", {transform: `translate(${x},${y})`}, L.fx), inner = el("g", {}, g);
  el("path", {d: "M0-12l3 8.5l8.5 3.5l-8.5 3.5l-3 8.5l-3-8.5l-8.5-3.5l8.5-3.5z", fill: col, transform: `scale(${s})`}, inner);
  hidden(inner);
  tl.to(inner, {scale: 1, rotation: 40, duration: 0.3, ease: "back.out(2)"}, t);
  tl.to(inner, {scale: 0, rotation: 90, duration: 0.3, ease: "power1.in"}, t + 0.45);
};
// storage is deleted: the tables shake, then are gone; their outlines stay
const dropTables = (t, tb) => {
  tb.cyls.forEach((c, i) => {
    const t0 = t + i * 0.16;
    shake(t0, c.inner, 3);
    tl.to(c.inner, {scale: 0, opacity: 0, duration: 0.3, ease: "back.in(2)", svgOrigin: `${c.cx} ${c.cy}`}, t0 + 0.42);
    fade(t0 + 0.5, c.ghost, 1, 0.2);
    c.puffs.forEach((p, j) => {
      tl.set(p, {opacity: 0.75}, t0 + 0.62);
      tl.to(p, {x: (j % 2 ? 1 : -1) * (8 + j * 3), y: -6 - j * 3, attr: {r: 9}, opacity: 0, duration: 0.6, ease: "power2.out"}, t0 + 0.62);
    });
  });
  swap(t + 0.9, tb.name, tb.gone);
  return t + 1.3;
};
// a permission is revoked
const revoke = (t, gr) => { shake(t, gr.g, 3); swap(t + 0.3, gr.ok, gr.no); return t + 0.6; };
// compute goes up in flames, and burns until `until`
const burn = (t, r, until) => {
  fade(t, r.fire, 1, 0.3);
  fade(t + 0.1, r.char, 0.5, 0.8);
  shake(t, r.g, 3);
  r.flames.forEach((f, i) => {
    gsap.set(f, {scaleY: 0.2, scaleX: 0.8, svgOrigin: "0 0"});
    const d = 0.15 + rnd() * 0.12, t0 = t + i * 0.08;
    tl.to(f, {scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(2)"}, t0);
    tl.to(f, {scaleY: 0.78 + rnd() * 0.1, scaleX: 1.1, duration: d, yoyo: true, repeat: Math.max(1, Math.floor((until - t0 - 0.3) / d) - 1), ease: "sine.inOut"}, t0 + 0.3);
  });
  r.smoke.forEach((s, i) => {
    const t0 = t + 0.4 + i * 0.5, d = 1.5, n = Math.max(0, Math.floor((until - t0) / d) - 1);
    tl.fromTo(s, {y: 0, opacity: 0.55}, {y: -30 - i * 6, opacity: 0, duration: d, repeat: n, ease: "power1.out", immediateRender: false}, t0);
  });
  return t + 0.6;
};
// a dashboard breaks: its bars fall, its face cracks
const breakDash = (t, d) => {
  shake(t, d.g, 4);
  d.bars.forEach((b, i) => tl.to(b, {scaleY: 0.1, duration: 0.3, ease: "bounce.out", svgOrigin: `0 ${d.by}`}, t + 0.1 + i * 0.05));
  fade(t + 0.35, d.broken, 1, 0.25);
  return t + 0.7;
};
// the change lands well: a green border for a moment and a star
const update = (t, o) => { pulse(t, o, FAM.ok, 0.7); star(t, o.x + o.w - 4, o.y + 2, 0.8); };
const improve = (t, d) => {
  update(t, d);
  tl.to(d.trend, {attr: {"stroke-dashoffset": 0}, duration: 0.6, ease: "power2.out"}, t + 0.1);
  fade(t + 0.6, d.star, 1, 0.2);
};

// ----- the ways through the platform -----
// A user's request, in the order every request takes: the front door, identity and auth, one
// authorizer (workspace ACLs for a dashboard, Unity Catalog for data), then the grant, the compute
// and the storage of the environment. o.fail names where it is refused or breaks.
const request = (t, u, s, o = {}) => {
  const via = o.via || "uc", zt = via === "uc" ? G.uc : G.acl, col = FAM.user;
  const zx = zt.cx, B = G.BUS;
  let e = fly(t, G.pUser(u), {col});
  ring(e - 0.42, ...G.cross.R, col);
  pulse(e, G.door, col, 0.4);
  e = fly(e, G.pDoorAuth("R"), {col});
  pulse(e, G.auth, FAM.ok);
  e = verdict(e, ...corner(G.auth), true);
  e = fly(e, G.pAuthTo(via), {col});
  let fwd = [...G.pUser(u), ...G.pDoorAuth("R"), ...G.pAuthTo(via)];
  const back = (at, ok) => fly(at, rev(dedupe(fwd)), {col: ok ? FAM.ok : FAM.no, speed: 1000});
  if (o.fail === "authz") {
    pulse(e, zt, FAM.no, 0.9);
    shake(e, zt.g, 3);
    verdict(e, ...corner(zt), false, o.tag, {dy: 54, hold: 2.4});
    return back(e + 0.55, false);
  }
  pulse(e, zt, FAM.ok);
  e = verdict(e, ...corner(zt), true);
  // down the lane: past the dashboard (asked through workspace ACLs), the grant, the compute, to the tables
  const stops = [s.dash, s.grant, s.rack, s.tab], last = o.fail === "dash" ? 0 : o.fail === "rack" ? 2 : 3;
  const first = via === "acl" ? 0 : 1;
  const down = [[zx, 118], [zx, B], [s.gx, B], ...stops.slice(0, last + 1).map((p) => [s.gx, p.cy]), [s.x + 4, stops[last].cy]];
  const at = times(e, down);
  fwd = fwd.concat(down);
  stops.slice(0, last + 1).forEach((p, i) => {
    if (i < first) return;
    const ti = i === last ? at[at.length - 1] : at[3 + i];
    if (i === last && o.fail) { verdict(ti, ...corner(p), false, o.tag, {hold: 2.4}); return; }
    if (p === s.dash) pulse(ti, p, col);
    else if (p === s.grant) pulse(ti, p, FAM.token, 0.4);
    else if (p === s.rack) lightRack(ti, p);
    else hitTables(ti, p);
  });
  e = fly(e, down, {col});
  return back(e + (o.fail ? 0.5 : 0.35), !o.fail);
};
// a happy user: a request, the answer on the laptop, a bubble
const happy = (t, u, s, via, b) => {
  const e = request(t, u, s, {via});
  flash(e, u); nod(e, u);
  if (b) say(e + 0.05, b, 1.7);
  return e;
};

// A call of the deployment: from GitHub Actions through the same front door, authenticated, then
// authorized, then down to the object it changes. Returns the second it arrives.
const deployTo = (t, from, via, s, obj, o = {}) => {
  const zt = via === "uc" ? G.uc : G.acl, zx = zt.cx, col = o.col || FAM.dev, speed = o.speed || 760;
  const pts = dedupe([...G.pTrunk(from), [640, G.RAIL_Y], [640, 118], [zx, 118], [zx, G.BUS], [s.gx, G.BUS], [s.gx, obj.cy], [s.x + 4, obj.cy]]);
  const at = times(t, pts, speed);
  ring(at[2] + 7 / speed, ...G.cross.L, col);
  pulse(at[3], G.door, col, 0.3);
  pulse(at[5], G.auth, FAM.ok, 0.3);
  pulse(at[6], zt, FAM.ok, 0.3);
  return fly(t, pts, {col, speed, r: o.r});
};
// the first call of a deployment, shown slowly: the token, the two verdicts
const signIn = (t, from, o = {}) => {
  let e = fly(t, G.pTrunk(from), {col: FAM.token, speed: 620});
  ring(e - 0.35, ...G.cross.L, FAM.token);
  pulse(e, G.door, FAM.token, 0.4);
  e = fly(e, G.pDoorAuth("L"), {col: FAM.token, speed: 620});
  pulse(e, G.auth, FAM.ok, 1.2);
  e = verdict(e, ...corner(G.auth), true, o.who || "authenticated", {dy: 54, hold: o.hold || 2.6, wait: 0.5});
  fly(e, G.pAuthTo("uc"), {col: FAM.dev, speed: 620});
  const e2 = fly(e, G.pAuthTo("acl"), {col: FAM.dev, speed: 620});
  pulse(e2, G.uc, FAM.ok, 1); pulse(e2, G.acl, FAM.ok, 1);
  verdict(e2, ...corner(G.uc), true, o.quiet ? "" : "authorized", {dy: 54, hold: (o.hold || 2.6) - 0.9});
  return verdict(e2, ...corner(G.acl), true, o.quiet ? "" : "authorized", {dy: 54, hold: (o.hold || 2.6) - 0.9, wait: 0.6});
};

// the stamp that closes a scene
const stamp = (t, lines, col) => {
  const [cx, cy] = G.mid, w = Math.max(...lines.map((l) => textW(l, '600 30px "Nunito", system-ui, sans-serif') * 1.09)) + 56, h = lines.length * 38 + 26;
  const g = el("g", {transform: `translate(${cx},${cy})`}, L.top), inner = el("g", {}, g);
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: 14, fill: "#fff", opacity: 0.94}, inner);
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: 14, fill: "none", stroke: col, "stroke-width": 4}, inner);
  el("rect", {x: -w / 2 + 7, y: -h / 2 + 7, width: w - 14, height: h - 14, rx: 9, fill: "none", stroke: col, "stroke-width": 1.5}, inner);
  lines.forEach((l, i) => txt(0, -h / 2 + 49 + i * 38, l, "stamp-t", inner, {"text-anchor": "middle", fill: col}));
  gsap.set(inner, {opacity: 0, scale: 2.2, rotation: -4, svgOrigin: "0 0"});
  tl.to(inner, {opacity: 1, scale: 1, duration: 0.3, ease: "power3.in"}, t);
  shake(t + 0.3, L.top, 3);
  return t + 0.8;
};

// ---------- scene 1: one environment, a change straight to main ----------
// Eight beats. The users' requests take the full path every time (door, identity and auth, an
// authorizer, compute, storage); the deployment takes the same door and passes the same checks,
// which is the point: the deploy principal may make the change, so only a process in front of it
// can stop it.
function scene1() {
  const [dana, fay, gus] = G.users, [s0, s1, s2] = G.stacks, gh = G.gh;
  hidden(gh.commit);

  // 1. happy users
  beat(0, "Happy users", "Requests fly in and answers come back. Each one is authenticated at identity and auth, then authorized by Unity Catalog or the workspace ACLs, before compute touches storage.");
  happy(0.3, fay, s1, "acl", ubub(fay, ["👍"], "good"));
  happy(1.2, dana, s0, "uc", ubub(dana, ["works!"], "good"));
  happy(2.2, gus, s2, "uc", ubub(gus, ["🙂"], "good"));
  happy(6.9, fay, s1, "acl");
  happy(7.6, dana, s0, "uc", ubub(dana, ["👍"], "good"));
  happy(9.2, gus, s2, "uc");
  happy(13.2, fay, s1, "acl", ubub(fay, ["🙂"], "good"));
  happy(13.6, dana, s0, "uc");
  happy(15.6, gus, s2, "uc", ubub(gus, ["👍"], "good"));

  // 2. one small thing: straight to main
  let t = beat(6.4, "One small thing", "Victor commits straight to main. No pull request, no check and no approval stand between his laptop and production.");
  say(t + 0.3, think(["let me change", "one small", "thing…"]), 3.6);
  typing(t + 0.8, G.dev, 2.4);
  nod(t + 3.3, G.dev);
  let e = fly(t + 3.5, G.pPush, {col: FAM.dev, speed: 300});
  pop(e, gh.commit);
  ring(e, 216, gh.repo.y + 54, FAM.dev, 8, 24);
  pulse(e, gh.repo, FAM.dev, 0.8);
  gh.skips.forEach((s, i) => {
    const ts = e + 0.5 + i * 0.42;
    shake(ts, s.g, 3);
    tl.to(s.x, {stroke: FAM.no, duration: 0.15}, ts);
    tl.to(s.r, {stroke: FAM.no, duration: 0.15}, ts);
    tl.to(s.t, {fill: INK_NO, duration: 0.15}, ts);
  });
  const tDeploy = e + 1.9, END = 44;
  swap(tDeploy, gh.idle, gh.busy);
  pulse(tDeploy, gh.act, FAM.dev, 1);
  turn(tDeploy, gh.spin, END - tDeploy);
  tl.to(gh.bar, {attr: {width: 214}, duration: END - tDeploy, ease: "none"}, tDeploy);

  // 3. Deploying…: the pipeline signs in, and is allowed
  t = beat(12.8, "Deploying…", "The pipeline signs in. It is authenticated, then authorized: the deploy principal may change all of this, so the platform does what it is told.");
  signIn(t + 0.3, gh.out, {hold: 3});

  // 4. storage is deleted, tables vanish
  t = beat(17.8, "Storage is deleted", "The change drops the schemas, and the tables vanish with them. The next query finds nothing.");
  [s0, s1, s2].forEach((s, i) => dropTables(deployTo(t + 0.1 + i * 0.4, gh.out, "uc", s, s.tab), s.tab));
  e = request(t + 1.9, dana, s0, {fail: "authz", tag: "table not found"});
  fade(e, dana.alarm, 1); shake(e, dana.bust, 3);
  const b1 = ubub(dana, ["?!"], "bad");
  bshow(e + 0.05, b1);

  // 5. permissions are revoked
  t = beat(23.6, "Permissions are revoked", "The grants are revoked too. Unity Catalog now refuses the same people it allowed a minute ago.");
  [s0, s1, s2].forEach((s, i) => revoke(deployTo(t + 0.1 + i * 0.4, gh.out, "uc", s, s.grant), s.grant));
  e = request(t + 1.1, gus, s2, {fail: "authz", tag: "access denied"});
  fade(e, gus.alarm, 1); shake(e, gus.bust, 3);
  bshow(e + 0.05, ubub(gus, ["access denied"], "bad"));

  // 6. compute goes up in flames
  t = beat(29.6, "Compute goes up in flames", "The compute is torn down and replaced while queries are running on it.");
  let lit = 0;
  [s2, s1, s0].forEach((s, i) => { lit = deployTo(t + 0.1 + i * 0.3, gh.out, "acl", s, s.rack); burn(lit, s.rack, END); });
  bhide(lit + 0.3, b1);
  bshow(lit + 0.5, ubub(dana, ["🔥"], "bad"));
  shake(lit + 0.5, dana.bust, 3);

  // 7. dashboards break
  t = beat(34.4, "Dashboards break", "A dashboard is only as alive as its warehouse, its grants and its tables.");
  [s1, s2, s0].forEach((s, i) => breakDash(deployTo(t + 0.1 + i * 0.3, gh.out, "acl", s, s.dash), s.dash));
  e = request(t - 0.4, fay, s1, {via: "acl", fail: "dash", tag: "query failed"});
  fade(e, fay.alarm, 1); shake(e, fay.bust, 3);
  bshow(e + 0.05, ubub(fay, ["my dashboard!"], "bad"));

  // 8. the frozen frame
  t = beat(Math.max(40, e + 0.9), "One environment, no checks", "Nothing stood between one small change and production: no review, no dry run, no environment to break first.");
  bshow(t + 0.3, think(["…oops"], "bad"));
  shake(t + 0.3, G.dev.bust, 3);
  stamp(t + 1.1, ["ONE ENVIRONMENT,", "NO CHECKS"], FAM.no);
  return END;
}

// ---------- scene 2: the same change, done properly ----------
// Eight beats: a pull request, CI with a dry run, the plan that catches the error, the fix and the
// review, then dev, acc and, after an approval, prd. The users work in prd from the first second
// to the last and never see a failure.

// the plan of a dry run, as a card beside the CI tile
const planCard = (rows, foot, ok) => {
  const x = 302, w = 372, h = 50 + rows.length * 23 + 40, py = G.gh.checks[2].y;
  const y = Math.max(G.planTop, py - h + 36);                 // the pointer leaves the card near its foot
  const g = el("g", {}, L.top), inner = el("g", {}, g);
  el("rect", {x: x + 2, y: y + 5, width: w - 4, height: h, rx: 14, class: "sh1"}, inner);
  el("path", {d: `M${x + 1} ${py - 9}L${x - 12} ${py}L${x + 1} ${py + 9}Z`, class: "plan"}, inner);
  el("rect", {x, y, width: w, height: h, rx: 13, class: "plan"}, inner);
  el("path", {d: `M${x} ${py - 8}v16`, class: "plan-seam"}, inner);
  txt(x + 18, y + 30, "Dry run: the plan", "tt big", inner);
  const lines = rows.map(([sign, verb, what, bad], i) => {
    const ly = y + 60 + i * 23, lg = el("g", {opacity: 0}, inner);
    if (bad) el("rect", {x: x + 10, y: ly - 17, width: w - 20, height: 23, rx: 5, class: "plan-bad"}, lg);
    txt(x + 18, ly, sign, "mono b " + (bad ? "no" : "ink"), lg);
    txt(x + 38, ly, verb, "mono b " + (bad ? "no" : "ink"), lg);
    txt(x + 118, ly, what, "mono " + (bad ? "no" : "ink"), lg);
    return lg;
  });
  const fy = y + h - 16, fg = el("g", {opacity: 0}, inner);
  el("line", {x1: x + 14, y1: fy - 24, x2: x + w - 14, y2: fy - 24, stroke: "#e6e3de"}, fg);
  mark(fg, x + 27, fy - 6, ok, 9);
  txt(x + 44, fy, foot, "tt " + (ok ? "ok" : "no"), fg);
  gsap.set(inner, {opacity: 0, scale: 0.6, svgOrigin: `${x - 12} ${py}`});
  return {g: inner, lines, foot: fg, x, y, w, h};
};
// a dashed red outline: "this would be gone"
const wouldGo = (o, pad = 4) => el("rect", {x: o.x - pad, y: o.y - pad, width: o.w + 2 * pad, height: o.h + 2 * pad + (o.cyls ? 22 : 0), rx: 10, class: "would", opacity: 0}, L.fx);
const blink = (t, node) => { fade(t, node, 1, 0.12); tl.to(node, {opacity: 0.25, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut"}, t + 0.15); fade(t + 2.1, node, 0, 0.3); };

function scene2() {
  const [dana, fay, gus] = G.users, [dev, acc, prd] = G.stacks, gh = G.gh, st = gh.st, END = 54.5;
  gh.checks.forEach((c) => hidden(c.ok, c.no));
  hidden(gh.revOk, gh.rev2Ok, gh.gateOpen);
  [gh.rev, gh.rev2].forEach((a) => gsap.set(a.inner, {scale: 0, svgOrigin: `${a.cx} ${a.cy}`}));

  // the users, at work in prd the whole time
  const good = (u, l) => ubub(u, [l], "good");
  [[0.4, 1], [7.4, 0], [14.4, 1], [21.4, 0], [28.4, 1], [35.2, 0], [41.8, 1]].forEach(([t, b]) => happy(t, dana, prd, "uc", b ? good(dana, t > 20 ? "👍" : "works!") : null));
  [[2.6, 1], [9.8, 0], [17, 1], [24.2, 0], [31.4, 1], [38.4, 0], [44, 0]].forEach(([t, b]) => happy(t, fay, prd, "acl", b ? good(fay, t > 20 ? "🙂" : "👍") : null));
  [[4.8, 1], [12.2, 0], [19.6, 1], [27, 0], [34.2, 1], [40.8, 0]].forEach(([t, b]) => happy(t, gus, prd, "uc", b ? good(gus, t > 20 ? "👍" : "🙂") : null));

  // 1. a pull request
  let t = beat(0, "The same change, as a pull request", "Victor pushes a branch and opens a pull request. Nothing reaches the platform yet, and the users keep working.");
  say(t + 0.5, think(["same change,", "this time a", "pull request"]), 3.4);
  typing(t + 0.9, G.dev, 2.4);
  nod(t + 3.4, G.dev);
  let e = fly(t + 3.7, G.pPush, {col: FAM.dev, speed: 300});
  swap(e, st.none, st.open);
  pulse(e, gh.pr, FAM.dev, 0.9);
  ring(e, ...gh.repoIn, FAM.dev, 6, 22);

  // 2. CI: pre-commit, unit tests, a dry run
  t = beat(6.4, "CI runs", "pre-commit, the unit tests, then a dry run: the plan of what the change would do, read from the real environment and applied to nothing.");
  const runCheck = (at, c, secs, ok) => {
    fade(at, c.idle, 0, 0.1); fade(at, c.run, 1, 0.15);
    tl.to(c.spin, {rotation: "+=" + 360 * Math.max(1, Math.round(secs / 0.9)), duration: secs, ease: "none", svgOrigin: "0 0"}, at);
    if (ok == null) return at + secs;
    fade(at + secs, c.run, 0, 0.1); pop(at + secs, ok ? c.ok : c.no);
    return at + secs;
  };
  const [c0, c1, c2] = gh.checks;
  pulse(t + 0.2, gh.ci, FAM.token, 0.8);
  e = runCheck(t + 0.3, c0, 1.2, true);
  e = runCheck(e + 0.15, c1, 1.6, true);
  const tPlan = e + 0.15;
  // the dry run reads prd through the same door: authenticated, authorized, and it changes nothing
  e = deployTo(tPlan + 0.2, gh.ciOut, "uc", prd, prd.tab, {col: FAM.plat, speed: 900});
  hitTables(e, prd.tab);
  fly(e + 0.3, rev(dedupe([...G.pTrunk(gh.ciOut), [640, G.RAIL_Y], [640, 118], [G.uc.cx, 118], [G.uc.cx, G.BUS], [prd.gx, G.BUS], [prd.gx, prd.tab.cy], [prd.x + 4, prd.tab.cy]])), {col: FAM.plat, speed: 1100});

  // 3. the plan catches a critical error
  t = beat(13.4, "The plan catches it", "The small change would drop a schema, revoke a grant and replace a warehouse. The check fails, the pull request turns red, and production never noticed.");
  runCheck(tPlan, c2, t + 3.1 - tPlan, false);
  const bad = planCard([["~", "update", "job schedule"], ["-", "drop", "schema + 3 tables", 1], ["-", "revoke", "SELECT from analysts", 1], ["-", "replace", "SQL warehouse", 1]], "3 destructive changes", false);
  tl.to(bad.g, {opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)"}, t + 0.1);
  const ghosts = [null, wouldGo(prd.tab), wouldGo(prd.grant), wouldGo(prd.rack)];
  bad.lines.forEach((l, i) => {
    const tt = t + 0.6 + i * 0.62;
    fade(tt, l, 1, 0.18);
    if (i) { shake(tt, l, 3); blink(tt + 0.1, ghosts[i]); }
  });
  fade(t + 3.1, bad.foot, 1);
  shake(t + 3.1, gh.ci.g, 3);
  swap(t + 3.3, st.open, st.red);
  tl.to(gh.pr.face, {stroke: FAM.no, strokeWidth: 3, duration: 0.15}, t + 3.3);
  shake(t + 3.3, gh.pr.g, 3);
  say(t + 4.1, think(["Oh! This is so", "nice I took the", "LLMOps course!"], "good"), 4.2);
  nod(t + 4.2, G.dev); nod(t + 5.2, G.dev);

  // 4. the fix, green CI, a review
  t = beat(22.2, "Fixed, green, approved", "The fix goes in. The new plan destroys nothing, CI is green and a reviewer approves: the pull request merges.");
  tl.to(bad.g, {opacity: 0, scale: 0.8, duration: 0.25}, t);
  say(t + 0.2, think(["fix: rename,", "don't recreate"]), 2.3);
  typing(t + 0.5, G.dev, 1.6);
  e = fly(t + 2.3, G.pPush, {col: FAM.dev, speed: 300});
  swap(e, st.red, st.open);
  tl.to(gh.pr.face, {stroke: "#d9d6d1", strokeWidth: 1.5, duration: 0.2}, e);
  unpop(e, c0.ok); unpop(e, c1.ok); unpop(e, c2.no);
  [c0, c1, c2].forEach((c) => fade(e + 0.1, c.idle, 1, 0.12));
  e = runCheck(e + 0.4, c0, 0.7, true);
  e = runCheck(e + 0.1, c1, 0.9, true);
  e = runCheck(e + 0.1, c2, 1.1, true);
  const okCard = planCard([["~", "update", "job schedule"], ["~", "rename", "schema, in place"]], "0 destroyed", true);
  tl.to(okCard.g, {opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)"}, e - 0.3);
  okCard.lines.forEach((l, i) => fade(e + i * 0.2, l, 1, 0.15));
  fade(e + 0.45, okCard.foot, 1);
  tl.to(okCard.g, {opacity: 0, scale: 0.8, duration: 0.25}, e + 2.6);
  swap(e + 0.3, st.open, st.green);
  pulse(e + 0.3, gh.pr, FAM.ok, 1);
  tl.to(gh.rev.inner, {scale: 1, duration: 0.35, ease: "back.out(2.2)"}, e + 1);
  pop(e + 1.6, gh.revOk);
  swap(e + 1.7, st.green, st.ok);
  swap(e + 2.6, st.ok, st.merged);
  pulse(e + 2.6, gh.pr, FAM.user, 0.9);

  // 5, 6, 7. dev, then acc, then prd after an approval
  const chip = (at, c, done) => {
    tl.to(c.r, {fill: done ? "#e3f3ea" : "#fdf3d9", stroke: done ? FAM.ok : FAM.token, strokeWidth: 2.5, duration: 0.2}, at);
    tl.to(c.t, {fill: done ? INK_OK : "#7a5a12", duration: 0.2}, at);
    if (!done) ring(at, c.cx, c.cy, FAM.token, 14, 30);
  };
  const deploy = (at, s, first) => {
    const env = s.env, c = gh.chips[env.name];
    chip(at, c, false);
    tl.to(env.pill, {stroke: FAM.dev, strokeWidth: 2.5, duration: 0.2}, at);
    env.cells.forEach((cl) => tl.to(cl, {stroke: FAM.dev, strokeWidth: 2.5, duration: 0.2}, at));
    let go = at + 0.2;
    if (first) go = signIn(at + 0.2, gh.out, {hold: 2.3}) - 0.5;
    const a1 = deployTo(go, gh.out, "acl", s, s.dash);
    const a2 = deployTo(go + 0.3, gh.out, "acl", s, s.rack);
    const a3 = deployTo(go + 0.6, gh.out, "uc", s, s.tab);
    improve(a1, s.dash);
    update(a2, s.rack); lightRack(a2, s.rack, 0.7);
    hitTables(a3, s.tab);
    const done = Math.max(a1, a2, a3);
    swap(done, env.v1, env.v2);
    // the smoke check: one real request through the new version
    const pts = dedupe([...G.pTrunk(gh.out), [640, G.RAIL_Y], [640, 118], [G.uc.cx, 118], [G.uc.cx, G.BUS], [s.gx, G.BUS], [s.gx, s.tab.cy], [s.x + 4, s.tab.cy]]);
    const ps = Math.max(go + 0.95, done + 0.15 - pathLen(pts) / 900), at2 = times(ps, pts, 900);
    fly(ps, pts, {col: FAM.data, speed: 900});
    pulse(at2[5], G.auth, FAM.ok, 0.3); pulse(at2[6], G.uc, FAM.ok, 0.3);
    const land = at2[at2.length - 1];
    pulse(land - 0.3, s.grant, FAM.token, 0.3); lightRack(land - 0.2, s.rack, 0.5); hitTables(land, s.tab);
    fade(land + 0.15, env.smoke, 1);
    ring(land + 0.15, env.x + env.w - 60, 177, FAM.ok, 8, 22);
    chip(land + 0.4, c, true);
    tl.to(env.pill, {stroke: FAM.ok, duration: 0.3}, land + 0.4);
    env.cells.forEach((cl) => tl.to(cl, {stroke: "rgba(80,111,160,.3)", strokeWidth: 1.2, duration: 0.4}, land + 0.6));
    return land + 0.6;
  };
  t = beat(Math.max(31, e + 3.4), "Deploy to dev", "The pipeline signs in as dev's own deploy principal: authenticated, authorized, deployed. A smoke check passes.");
  e = deploy(t + 0.2, dev, true);
  t = beat(e + 0.5, "Then acc", "The same change, the next environment, its own deploy principal. The smoke check passes again.");
  e = deploy(t + 0.2, acc);
  t = beat(e + 0.5, "prd, after an approval", "The prd job waits for a person. Approved, it deploys, and the smoke check passes while the users keep working.");
  tl.fromTo(gh.gateRing, {attr: {r: 14}, opacity: 0.9}, {attr: {r: 27}, opacity: 0, duration: 0.8, repeat: 2, ease: "power2.out", immediateRender: false}, t + 0.1);
  tl.to(gh.note, {fill: "#7a5a12", duration: 0.2}, t + 0.1);
  tl.to(gh.rev2.inner, {scale: 1, duration: 0.35, ease: "back.out(2.2)"}, t + 1.3);
  pop(t + 2, gh.rev2Ok);
  unpop(t + 2.2, gh.gate); pop(t + 2.3, gh.gateOpen);
  tl.to(gh.note, {fill: INK_OK, duration: 0.2}, t + 2.3);
  e = deploy(t + 2.6, prd);
  tl.to(gh.rev2.inner, {scale: 0, duration: 0.2}, e); unpop(e, gh.rev2Ok);

  // 8. the users only see the result
  t = beat(e + 0.6, "So much better", "The users only see the result. The change was wrong once, in a pull request, where it cost nothing.");
  [fay, dana, gus].forEach((u, i) => { bshow(t + 0.3 + i * 0.55, ubub(u, ["Oh! The system became", "so much better!"], "good")); nod(t + 0.4 + i * 0.55, u); flash(t + 0.3 + i * 0.55, u); });
  stamp(t + 2.6, ["PULL REQUEST · CHECKS", "DEV → ACC → PRD"], FAM.ok);
  return Math.max(END, t + 5.6);
}

// ---------- the page: build, controls, keys, the postMessage protocol ----------
// The deck embeds this page in an iframe and drives it with messages (README.md has the protocol):
//   in:  {type: "part4", cmd: "scene", n: 1|2}, {cmd: "play"}, {cmd: "pause"}, {cmd: "step"}
//   out: {type: "part4", event: "ready"}, {type: "part4", event: "scene-end", scene: 1|2}
const SCENES = {1: scene1, 2: scene2};
let cur = 1, H = 0, stopAt = null, ended = false, curBeat = -1, speed = 1, quiet = false, started = false;
const EPS = 0.02;      // a step stops this long before the next beat, so the caption still names the beat just played

const stageH = () => {
  const r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return 640;                       // built while hidden: a middle height, rebuilt when shown
  return Math.max(HMIN, Math.min(HMAX, Math.round((W * r.height) / r.width)));
};

function build(n, at = 0) {
  if (tl) tl.kill();
  quiet = true;
  cur = n; H = stageH(); beats = []; seed = 7; avatarN = 0;
  G = buildWorld(n, H);
  tl = gsap.timeline({paused: true, onUpdate: tick, onComplete: done});
  const end = SCENES[n]();
  tl.to({}, {duration: 0.01}, end);
  tl.timeScale(speed);
  ended = false; stopAt = null; curBeat = -1;
  $("dots").replaceChildren(...beats.map((b, i) => {
    const d = document.createElement("button");
    d.textContent = i + 1;
    d.title = b.title;
    d.setAttribute("aria-label", `Beat ${i + 1}: ${b.title}`);
    d.onclick = () => { seek(i); step(); };
    return d;
  }));
  [1, 2].forEach((k) => $("s" + k).setAttribute("aria-selected", String(k === n)));
  svg.setAttribute("aria-label", n === 1
    ? "Scene 1. A developer on the left pushes a change straight to main on GitHub; it deploys into the only environment, inside your Databricks account, while the platform users on the right are at work."
    : "Scene 2. The same change goes through a pull request, CI with a dry run, a review, then dev, acc and prd side by side inside your Databricks account, while the platform users on the right keep working.");
  if (at > 0) tl.time(Math.min(at, tl.duration()));
  quiet = false;
  tick();
}

function tick() {
  if (!tl) return;
  let t = tl.time();
  if (stopAt != null && t >= stopAt && !tl.paused()) { t = stopAt; stopAt = null; tl.pause(); tl.time(t); }
  let b = 0;
  beats.forEach((x, i) => { if (t >= x.t - 1e-3) b = i; });
  if (b !== curBeat) {
    curBeat = b;
    $("capN").textContent = `${b + 1} / ${beats.length}`;
    $("capP").replaceChildren(Object.assign(document.createElement("b"), {textContent: beats[b].title + (/[….!?]$/.test(beats[b].title) ? "" : ".")}), " " + beats[b].text);
    [...$("dots").children].forEach((d, i) => { d.classList.toggle("now", i === b); d.classList.toggle("past", i < b); });
    if (!quiet) post({event: "beat", scene: cur, beat: b + 1, of: beats.length, title: beats[b].title});
  }
  const playing = !tl.paused() && !ended;
  $("bPlay").textContent = ended ? "↻ Replay" : playing ? "❚❚ Pause" : "▶ Play";
  $("bPlay").setAttribute("aria-pressed", String(playing));
  $("big").hidden = started || t > 0;
}
function done() {
  if (quiet || ended) return;
  ended = true; stopAt = null;
  tick();
  post({event: "scene-end", scene: cur});
}

function show(n, at = 0) {
  n = Number(n) === 2 ? 2 : 1;
  const changed = n !== cur;
  started = false;
  build(n, at);
  if (changed) post({event: "scene", scene: n});
}
function play() {
  started = true;
  if (ended) { ended = false; tl.time(0); }
  stopAt = null;
  tl.play();
  tick();
}
function pause() { tl.pause(); stopAt = null; tick(); }
function toggle() { (tl.paused() || ended ? play : pause)(); }
// one beat: play to the end of the beat the clock is in, and stop there
function step() {
  if (ended) return false;
  started = true;
  const t = tl.time(), next = beats.find((b) => b.t - EPS > t + 0.05);
  stopAt = next ? next.t - EPS : null;
  tl.play();
  tick();
  return true;
}
// to the start of a beat, paused
function seek(i) {
  i = Math.max(0, Math.min(beats.length - 1, i));
  ended = false; stopAt = null; started = true;
  tl.pause();
  tl.time(i ? beats[i].t - EPS : 0);
  tick();
}
function back() {
  const t = tl.time();
  let i = 0;
  beats.forEach((b, k) => { if (b.t - EPS < t - 0.4) i = k; });
  seek(i);
}
function setSpeed(v) {
  speed = Math.max(0.5, Math.min(3, Math.round(Number(v) * 4) / 4 || 1));
  $("speed").value = speed;
  $("speedOut").textContent = speed + "×";
  if (tl) tl.timeScale(speed);
}

// ----- controls -----
$("s1").onclick = () => show(1);
$("s2").onclick = () => show(2);
$("bPlay").onclick = toggle;
$("big").onclick = play;
$("bStep").onclick = () => { if (!step() && cur === 1) { show(2); step(); } };
$("bBack").onclick = back;
$("bReplay").onclick = () => { show(cur); play(); };
$("speed").oninput = (e) => setSpeed(e.target.value);

// Keys, when this page has the focus. What it does not use goes to the deck as a "key" event, so
// Esc, F and N keep working while the iframe is focused.
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target.tagName, onInput = tag === "INPUT", onButton = tag === "BUTTON";
  const k = e.key;
  let used = true;
  if (k === "ArrowRight" || k === "PageDown") {
    if (onInput) return;
    if (!step()) {
      if (cur === 1) { show(2); step(); }
      else { used = false; }
    }
  } else if (k === "ArrowLeft" || k === "PageUp") { if (onInput) return; back(); }
  else if (k === " " || k === "k") { if (onButton && k === " ") return; toggle(); }
  else if (k === "r") { show(cur); play(); }
  else if (k === "1" || k === "2") show(Number(k));
  else if (k === "[") setSpeed(speed - 0.25);
  else if (k === "]") setSpeed(speed + 0.25);
  else used = false;
  if (used) e.preventDefault();
  else if (k.length > 1 || /^[a-z0-9]$/i.test(k)) post({event: "key", key: k, shiftKey: e.shiftKey, scene: cur, ended});
});

// ----- the protocol -----
window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.type !== "part4" || typeof m.cmd !== "string" || !tl) return;
  if (m.cmd === "scene") { show(m.n, 0); if (m.play) play(); }
  else if (m.cmd === "play") play();
  else if (m.cmd === "pause") pause();
  else if (m.cmd === "step") step();
  else if (m.cmd === "back") back();
  else if (m.cmd === "beat") seek(Number(m.n) - 1);
  else if (m.cmd === "replay") { show(cur); play(); }
  else if (m.cmd === "speed") setSpeed(m.value);
});
document.addEventListener("visibilitychange", () => { if (document.hidden && tl && !tl.paused()) pause(); });

// the stage changed shape (the deck went full screen, the window was resized): draw the world for
// the new height and put the clock back where it was
let rz = 0;
new ResizeObserver(() => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    if (!tl || Math.abs(stageH() - H) < 4) return;
    const t = tl.time(), playing = !tl.paused(), sa = stopAt, was = ended, st = started;
    build(cur, t);
    started = st; stopAt = sa; ended = was;
    if (playing && !was) tl.play();
    tick();
  }, 120);
}).observe(stage);

// ----- start -----
const q = new URLSearchParams(location.search);
if (q.get("speed")) setSpeed(q.get("speed"));
const fonts = document.fonts ? Promise.all([document.fonts.load('600 17px "Nunito"'), document.fonts.load('500 17px "Nunito"'), document.fonts.load('500 16px "Fira Code"')]) : Promise.resolve();
Promise.race([fonts, new Promise((r) => setTimeout(r, 2500))]).catch(() => {}).then(() => {
  build(q.get("scene") === "2" ? 2 : 1);
  window.__part4 = {show, play, pause, step, back, seek, setSpeed, at: (t) => { ended = false; stopAt = null; started = true; tl.pause(); tl.time(t); tick(); }, state: () => ({scene: cur, time: tl.time(), duration: tl.duration(), paused: tl.paused(), ended, beat: curBeat + 1, beats: beats.map((b) => ({t: b.t, title: b.title})), H})};
  post({event: "ready", ok: true, scene: cur, scenes: 2, beats: beats.length});
  if (q.get("autoplay") === "1") play();
});

})();
</script>
