body{background:#f7f3ec;color:var(--body);font:1rem/1.45 "Nunito",system-ui,sans-serif;overflow:hidden}
button,select,input{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:.3rem .95rem;font-size:1rem;font-weight:500;white-space:nowrap;line-height:1.3}
button:hover{background:var(--alt)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
button.primary:hover{background:#333}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--link);outline-offset:2px}
code,.mono{font-family:"Fira Code",ui-monospace,monospace;font-size:.94em;font-variant-ligatures:none}
a{color:var(--link)}
/* The close-up: the scene's ground, GitHub's cloud filling it, two columns of white tiles. One
   screen, no page scroll; a column scrolls on its own only when the iframe is very low. */
/* the type follows the width, and the height where the frame is low; never under 16px */
html{font-size:max(16px,min(1.1vw,1.8vh))}
body{display:flex;flex-direction:column;padding:.45rem .75rem .6rem;gap:.35rem;
  background:#f7f3ec radial-gradient(rgba(138,117,86,.16) 1px,transparent 1.2px) 0 0/1.4rem 1.4rem}
code{background:var(--alt);color:var(--ink);padding:0 .28em;border-radius:4px;font-size:max(16px,.94em)}
.mono{font-size:max(16px,.94em)}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{list-style:none;padding:0}

.top{flex:none;display:flex;align-items:center;gap:.8rem}
.mini{flex:none;height:2rem;width:4rem}
.top h1{flex:none;font-size:1.3rem;font-weight:600;color:var(--ink);line-height:1.2;letter-spacing:-.01em}
.top p{flex:1 1 0;min-width:0;font-size:1rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{margin-left:auto;display:flex;gap:1.1rem;font-size:1rem;color:var(--ink);padding-right:.4rem}
.legend li{display:flex;align-items:center;gap:.4rem;white-space:nowrap}

/* the three states */
.dot{flex:none;display:inline-block;width:.85rem;height:.85rem;border-radius:50%;box-sizing:border-box}
.dot.auto{background:var(--ok)}
.dot.hand{background:#fff;border:.22rem solid var(--token)}
.dot.gap{background:linear-gradient(135deg,transparent 42%,var(--no) 42% 58%,transparent 58%) #fff;border:.13rem solid var(--no)}

/* GitHub's cloud: outlines first, fills over them, so the bumps and the body read as one shape */
.cloud{position:relative;flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:1.15rem;padding:.2rem .8rem .7rem}
.shape{position:absolute;inset:0;pointer-events:none}
.shape i{position:absolute;display:block}
.shape .o{background:#b9b4ab}
.shape .f{background:#eef0f4}
.shape .body{inset:0;border-radius:1.6rem}
.shape .f.body{inset:.2rem;border-radius:1.4rem}
.shape .b1,.shape .b2,.shape .b3,.shape .b4{border-radius:50%;left:var(--x);top:calc(var(--d) * -.36);width:var(--d);height:var(--d)}
.shape .f.b1,.shape .f.b2,.shape .f.b3,.shape .f.b4{left:calc(var(--x) + .2rem);top:calc(var(--d) * -.36 + .2rem);width:calc(var(--d) - .4rem);height:calc(var(--d) - .4rem)}
.shape .b1{--x:2.2rem;--d:3rem} .shape .b2{--x:4.6rem;--d:3.9rem} .shape .b3{--x:7.9rem;--d:3.4rem} .shape .b4{--x:10.7rem;--d:2.7rem}
.gh{position:relative;flex:none;display:flex;align-items:center;gap:.5rem;height:1.9rem;padding-left:.3rem;color:#8a7556;font-size:1rem}
.gh svg{width:1.45rem;height:1.45rem}
.gh b{font-size:1.2rem;font-weight:600;color:#6a5a40}

.cols{position:relative;flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(0,34fr) minmax(0,66fr);gap:.8rem}
.col{min-height:0;overflow:auto;scrollbar-width:thin;background:linear-gradient(#fff,#faf9f6);border:1.5px solid #d9d6d1;border-radius:.8rem;box-shadow:0 .2rem 0 rgba(26,26,26,.07);padding:.55rem .8rem .6rem;display:flex;flex-direction:column;gap:.4rem;transition:opacity .25s,box-shadow .25s}
.cloud[data-focus="1"] #colB,.cloud[data-focus="2"] #colA{opacity:.32}
.cloud[data-focus="1"] #colA,.cloud[data-focus="2"] #colB{box-shadow:0 0 0 .2rem var(--flame)}
.col-h{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;cursor:pointer}
.num{flex:none;display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--ink);color:#fff;font-weight:600;font-size:1rem}
.col h2{font-size:1.2rem;font-weight:600;color:var(--ink);line-height:1.25}
.badge{margin-left:auto;font-weight:600;font-size:1rem;border-radius:999px;padding:.05rem .75rem;white-space:nowrap}
.badge.good{background:#e3f3ea;color:var(--ink-ok);border:1.5px solid var(--ok)}
.badge.warn{background:#fbe9e7;color:var(--ink-no);border:1.5px dashed var(--no)}
.lede{font-size:1rem;line-height:1.35;color:var(--ink)}
.col h3{display:flex;align-items:baseline;gap:.8rem;font-size:1rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#6a5a40;margin-top:.15rem}
.col h3 span{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;color:var(--body)}

/* the pipeline of a repository, as the chips of the scene's CD tile */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .4rem;padding:.1rem 0}
.flow li{display:flex;align-items:center;gap:.4rem;background:#f4f2ee;border:1.5px solid #d9d6d1;border-radius:999px;padding:.1rem .7rem;white-space:nowrap;color:var(--ink)}
.flow li.arr{background:none;border:0;padding:0;color:var(--muted)}
.flow li.br{flex-basis:100%;height:0;padding:0;border:0}
.flow li.lab{background:none;border:0;padding:0 .2rem 0 0;color:var(--body)}
.flow li b{font-weight:600}
.flow li span{color:var(--body)}
.flow li.auto{background:#eef7f1;border-color:#b7d8c5}
.flow li.hand{background:#fdf6e3;border-color:#e6cf8f;border-style:dashed}
.flow li.gap{background:#fbe9e7;border-color:var(--no);border-style:dashed}
.flow .lk{width:.95rem;height:.95rem;fill:var(--ink-ok);stroke:var(--ink-ok)}

/* the rows */
.rows{display:flex;flex-direction:column;gap:.4rem}
.rows:not(.two) .row{padding-top:.3rem;padding-bottom:.3rem}
.rows.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.28rem .5rem}
.row{display:flex;align-items:baseline;gap:.5rem;border:1px solid var(--line-soft);border-radius:.55rem;padding:.22rem .45rem .22rem .6rem;cursor:pointer;background:#fff}
.row:hover,.gaprow:hover{border-color:#b9b4ab;background:#fbfaf7}
.row .dot{transform:translateY(.05rem)}
.row p{flex:1 1 0;min-width:0;line-height:1.35}
.row-t{font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:#b9c9e6;text-underline-offset:.18em;margin-right:.5rem}
.row-t:hover{color:var(--link);text-decoration-color:var(--link)}
.row-t::after{content:"↗";font-weight:500;color:var(--link);margin-left:.2rem;display:inline-block}
.row-s{color:var(--body)}
.rows:not(.two) .row-t{display:inline-block}
.rows:not(.two) .row-s{display:block}
.rows.two .row p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{flex:none;align-self:center;font-size:1rem;padding:0 .6rem;color:var(--link);border-color:var(--blue-bd);background:var(--blue-bg);line-height:1.4}
.more:hover{background:#e3ebf8}

/* the gaps: a table of three columns, the gap, today, what a full setup adds */
.gaps{display:flex;flex-direction:column;gap:.28rem}
.gaphead,.gaprow{display:grid;grid-template-columns:minmax(0,14.5rem) minmax(0,1fr) minmax(0,1.35fr);gap:0 .7rem;padding:0 .45rem 0 .6rem}
.gaphead{font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}
.gaphead span:nth-child(1){color:var(--body)} .gaphead span:nth-child(2){color:var(--ink-no);padding-left:.7rem} .gaphead span:nth-child(3){color:var(--ink-ok);padding-left:.7rem}
.gaprow{border:1.5px dashed #e3a39c;border-radius:.6rem;padding-top:.25rem;padding-bottom:.28rem;background:#fffaf9;cursor:pointer}
.g-t{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .5rem;align-items:baseline;align-content:start}
.g-t p{line-height:1.3}
.g-t .dot{transform:translateY(.05rem)}
.g-t .more{grid-column:2;justify-self:start}
.today,.full{line-height:1.33;color:var(--ink);border-left:.2rem solid var(--no);padding-left:.5rem}
.full{border-left-color:var(--ok)}
.docs{display:block;color:var(--body);white-space:nowrap}
.docs a::after,.links a::after{content:" ↗"}
.foot{color:var(--body);line-height:1.3}
#dlgB .today b,#dlgB .full b{display:block;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-no)}
#dlgB .full b{color:var(--ink-ok)}

/* the card of a row */
dialog{border:1.5px solid #3d4350;border-radius:.9rem;padding:0;width:min(46rem,92vw);max-height:88vh;color:var(--body);box-shadow:0 1.2rem 3rem rgba(26,26,26,.3);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(26,26,26,.38)}
#dlgB{overflow:auto;padding:1.1rem 1.3rem 1.2rem;display:flex;flex-direction:column;gap:.6rem}
#dlgB h2{font-size:1.35rem;font-weight:600;color:var(--ink);line-height:1.25;padding-right:2rem}
#dlgB h3{font-size:1.1rem;font-weight:600;color:var(--ink);margin-top:.5rem;border-top:1px solid var(--line);padding-top:.6rem}
#dlgB h4{font-size:1rem;font-weight:600;color:var(--ink);margin-top:.2rem}
#dlgB p{color:var(--ink);line-height:1.5}
.state{display:flex;align-items:center;gap:.45rem;font-weight:600;font-size:1rem;letter-spacing:.05em;text-transform:uppercase}
.links{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:.6rem;overflow:hidden}
.links li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 .8rem;align-items:baseline;padding:.3rem .7rem;border-top:1px solid var(--line-soft)}
.links li:first-child{border-top:0}
.links a{font-weight:600}
.links code{grid-column:1;background:none;padding:0;color:var(--body);overflow-wrap:anywhere}
.links span{grid-column:2;grid-row:1/3;align-self:center;white-space:nowrap;color:var(--body)}
.x{position:absolute;right:.5rem;top:.45rem;border:0;background:none;font-size:1.6rem;line-height:1;padding:.2rem .6rem;color:var(--body)}

</style>
</head>

rse_assistant/onboarding/run.py#L370-L390", "label": "_principal", "path": "src/course_assistant/onboarding/run.py", "lines": "370–390"}], "docs": []}, {"id": "environments", "state": "auto", "title": "Three GitHub environments", "short": "`dev`, `acc`, `prd`. `prd` needs the student's approval and takes `main` only.", "text": "The `repo` step of the onboarding gives each student repository the environments `dev`, `acc` and `prd`. `prd` has the student as required reviewer and `main` as its only branch.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/adapters/github.py#L688", "label": "ensure_environment", "path": "src/course_assistant/adapters/github.py", "lines": "688"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/repos.py#L336-L360", "label": "protect_repo", "path": "src/course_assistant/onboarding/repos.py", "lines": "336–360"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/repos.py#L282", "label": "ensure_repo", "path": "src/course_assistant/onboarding/repos.py", "lines": "282"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/run.py#L360", "label": "_repo", "path": "src/course_assistant/onboarding/run.py", "lines": "360"}], "docs": []}, {"id": "main", "state": "auto", "title": "A protected `main`", "short": "One approving review; admins are exempt.", "text": "The same step protects the student's `main` with one approving review. A new push dismisses a stale approval. The repository's admins, the student among them, are not held to the rule.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/adapters/github.py#L729-L738", "label": "protect_branch", "path": "src/course_assistant/adapters/github.py", "lines": "729–738"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/repos.py#L336-L360", "label": "protect_repo", "path": "src/course_assistant/onboarding/repos.py", "lines": "336–360"}], "docs": []}, {"id": "first", "state": "gap", "title": "The deployment workflow", "short": "Not in the template yet: a later lecture.", "text": "Read on `main` on 2026-11-23: the template ships `ci.yml` only, and the cohort's plan leaves the steps `first_deploy` and `first_deploy_acc` out, with the note that deployment is introduced in a later lecture. The code for it is there: the step dispatches a student's `deploy.yml` for `dev`, then for `acc`, and `prd` waits for the student's approval. So the environments, their principals and the approval rule are real today, and no workflow of the template deploys through them yet.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/repos.py#L569", "label": "ensure_first_deploy", "path": "src/course_assistant/onboarding/repos.py", "lines": "569"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/run.py#L400-L414", "label": "_first_deploy", "path": "src/course_assistant/onboarding/run.py", "lines": "400–414"}], "docs": []}, {"id": "check", "state": "auto", "title": "The template is checked when it changes", "short": "`publish-template.yml` renders it and, on `main`, validates all three targets.", "text": "In `course-assistant`, `publish-template.yml` runs on a pull request or a push to `main` that touches the template or its contract. It renders the template for the sample student, checks it against the CLI's bundle JSON schema and runs the starter's own CI. On `main` it also runs `databricks bundle validate` for `dev`, `acc` and `prd`.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/publish-template.yml#L87-L94", "label": "validate dev acc prd", "path": ".github/workflows/publish-template.yml", "lines": "87–94"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/publish-template.yml#L1-L94", "label": "publish-template.yml", "path": ".github/workflows/publish-template.yml", "lines": "1–94"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/publish-template.yml#L1-L12", "label": "header", "path": ".github/workflows/publish-template.yml", "lines": "1–12"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/publish-template.yml#L63-L94", "label": "steps", "path": ".github/workflows/publish-template.yml", "lines": "63–94"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/publish-template.yml#L14-L22", "label": "template paths", "path": ".github/workflows/publish-template.yml", "lines": "14–22"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/TECHNICAL-DESIGN.md#L1802-L1816", "label": "§ This repo's template check", "path": "docs/TECHNICAL-DESIGN.md", "lines": "1802–1816"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/tests/contract/test_template.py#L1-L40", "label": "unit tests", "path": "tests/contract/test_template.py", "lines": "1–40"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/template/cookiecutter.json#L1-L5", "label": "template/", "path": "template/cookiecutter.json", "lines": "1–5"}], "docs": []}]}, "platform": {"n": 2, "repo": "course-assistant", "title": "The platform's own repository", "badge": "one environment, no branch protection", "lede": "One workspace and one bundle target, `dev`, run in production mode: a merge to `main` deploys straight into the cohort workspace.", "flow": [{"t": "pull request", "n": "by convention", "state": "hand"}, {"t": "main", "n": "no protection", "state": "gap"}, {"t": "bundle deploy -t dev", "code": true, "state": "auto"}, {"t": "production"}], "heading": "The safety net as it is", "rows": [{"id": "workflows", "state": "auto", "title": "Workflows", "short": "five, on GitHub's runners", "text": "Five workflows, all on GitHub-hosted `ubuntu-latest`. `ci.yml` runs on every pull request and on pushes to `main`. `deploy.yml` runs on a push to `main` that touches the bundle or its sources: `bundle validate -t dev`, then `bundle deploy -t dev`. `onboarding.yml` runs daily at 06:00 UTC while its schedule is unpaused, and by dispatch. `evals.yml` runs on pull requests that touch the assessment. `publish-template.yml` checks the template. The jobs that reach Databricks sign in with GitHub OIDC, with no stored Databricks secret. Actions are pinned by commit SHA, jobs have timeouts, onboarding and deploy run one at a time, and secrets are set only on the step that needs them.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/ci.yml#L1-L80", "label": "ci.yml", "path": ".github/workflows/ci.yml", "lines": "1–80"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/deploy.yml#L1-L88", "label": "deploy.yml", "path": ".github/workflows/deploy.yml", "lines": "1–88"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/onboarding.yml#L1-L100", "label": "onboarding.yml", "path": ".github/workflows/onboarding.yml", "lines": "1–100"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/evals.yml#L1-L63", "label": "evals.yml", "path": ".github/workflows/evals.yml", "lines": "1–63"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/publish-template.yml#L1-L94", "label": "publish-template.yml", "path": ".github/workflows/publish-template.yml", "lines": "1–94"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/deploy.yml#L67-L71", "label": "validate and deploy", "path": ".github/workflows/deploy.yml", "lines": "67–71"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/TECHNICAL-DESIGN.md#L458", "label": "Workflow hardening row", "path": "docs/TECHNICAL-DESIGN.md", "lines": "458"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/onboarding.yml#L49-L62", "label": "permissions and concurrency", "path": ".github/workflows/onboarding.yml", "lines": "49–62"}], "docs": []}, {"id": "unit", "state": "auto", "title": "Unit tests", "short": "2,360, on every pull request", "text": "2,360 test functions in 102 files marked `unit`, counted on `main` on 2026-11-23. Pure Python: JSON fixtures, fake clients, no SQL engine. The `test` job of `ci.yml` runs pre-commit and `pytest -m unit` on every pull request. A red check does not block a merge.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/ci.yml#L20-L55", "label": "ci test", "path": ".github/workflows/ci.yml", "lines": "20–55"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/pyproject.toml#L49-L59", "label": "pytest config and markers", "path": "pyproject.toml", "lines": "49–59"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/tests/conftest.py#L1-L60", "label": "fakes and scratch helpers", "path": "tests/conftest.py", "lines": "1–60"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/TECHNICAL-DESIGN.md#L607-L627", "label": "§ Testing, rehearsal and operations", "path": "docs/TECHNICAL-DESIGN.md", "lines": "607–627"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/ci.yml#L41-L55", "label": "test steps", "path": ".github/workflows/ci.yml", "lines": "41–55"}], "docs": []}, {"id": "integration", "state": "hand", "title": "Integration tests", "short": "53, run by hand", "text": "53 test functions in 32 files marked `integration`. They touch the cohort workspace, GitHub, PyPI or the sheet; the ones that need tables use scratch catalogs `course_ops_verify_<key>` on the warehouse `wh-tests-llmops`. They are run by hand: CI runs none of them except the template's two. A test skips when its environment variables are unset.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/tests/conftest.py#L856-L875", "label": "scratch catalogs", "path": "tests/conftest.py", "lines": "856–875"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/tests/conftest.py#L790-L800", "label": "verify_warehouse skip rule", "path": "tests/conftest.py", "lines": "790–800"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/TECHNICAL-DESIGN.md#L621", "label": "Test warehouse decision", "path": "docs/TECHNICAL-DESIGN.md", "lines": "621"}], "docs": []}, {"id": "precommit", "state": "hand", "title": "Pre-commit hooks", "short": "before every push", "text": "`no-commit-to-branch` on `main`, private-key and credential-file checks, a 1 MB file cap, Conventional Commits, ruff and mypy. The rule is to run `uvx pre-commit run --all-files` and `uv run pytest` on the laptop before every push. CI runs the hooks again on the pull request.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.pre-commit-config.yaml#L12-L101", "label": "pre-commit config", "path": ".pre-commit-config.yaml", "lines": "12–101"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.pre-commit-config.yaml#L14-L17", "label": "no-commit-to-branch", "path": ".pre-commit-config.yaml", "lines": "14–17"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/CLAUDE.md#L86-L92", "label": "CLAUDE.md rule", "path": "CLAUDE.md", "lines": "86–92"}], "docs": []}, {"id": "evals", "state": "auto", "title": "Evals check", "short": "on assessment changes", "text": "`evals.yml` runs the assessment agent l#L66", "label": "DRY_RUN env", "path": ".github/workflows/onboarding.yml", "lines": "66"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/run.py#L1219-L1256", "label": "run", "path": "src/course_assistant/onboarding/run.py", "lines": "1219–1256"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/run.py#L908-L916", "label": "dry-run branch in onboard", "path": "src/course_assistant/onboarding/run.py", "lines": "908–916"}], "docs": []}, {"id": "filtered", "state": "hand", "title": "Filtered runs", "short": "`only`, `projects_only`", "text": "`only` takes the named students alone, reconciles nothing and takes no teachers' projects. `projects_only` takes only the teachers' projects. Both are for a run started by hand: `--only` on a scheduled run is refused.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/onboarding.yml#L40-L47", "label": "inputs", "path": ".github/workflows/onboarding.yml", "lines": "40–47"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/onboarding.yml#L20-L23", "label": "header", "path": ".github/workflows/onboarding.yml", "lines": "20–23"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/run.py#L749-L790", "label": "only_names and select_students", "path": "src/course_assistant/onboarding/run.py", "lines": "749–790"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/run.py#L1236-L1246", "label": "run guards", "path": "src/course_assistant/onboarding/run.py", "lines": "1236–1246"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/reconcile.py#L495", "label": "reconcile.filtered", "path": "src/course_assistant/onboarding/reconcile.py", "lines": "495"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/tasks/onboard.py#L10-L16", "label": "task docstring", "path": "src/tasks/onboard.py", "lines": "10–16"}], "docs": []}, {"id": "reconcile", "state": "auto", "title": "Reconcile, report mode", "short": "removes nothing", "text": "Removals are planned after the steps and printed. Nothing is removed unless the cohort file says `onboarding.reconcile: apply`. Today it says `report`.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/cohorts/llmops-2/cohort.yml#L86-L88", "label": "reconcile: report", "path": "cohorts/llmops-2/cohort.yml", "lines": "86–88"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/TECHNICAL-DESIGN.md#L497", "label": "Decision: Reconcile: report then apply", "path": "docs/TECHNICAL-DESIGN.md", "lines": "497"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/reconcile.py#L199", "label": "plan_removals", "path": "src/course_assistant/onboarding/reconcile.py", "lines": "199"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/reconcile.py#L412", "label": "apply_removals", "path": "src/course_assistant/onboarding/reconcile.py", "lines": "412"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/onboarding/reconcile.py#L467", "label": "reconcile", "path": "src/course_assistant/onboarding/reconcile.py", "lines": "467"}], "docs": []}, {"id": "verify", "state": "hand", "title": "Verify objects", "short": "`verify-*` names", "text": "An integration test that needs a catalog creates a scratch one, `course_ops_verify_<key>` or `verify_<key>_{dev,acc,prd}`, and `scripts/probe_workspace.py` creates only `verify-<thing>` objects. Each is deleted in a `finally`. `workspace_client` refuses a client whose host differs from the cohort file's.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/tests/conftest.py#L803-L875", "label": "scratch_catalog and scratch_cohort_catalogs", "path": "tests/conftest.py", "lines": "803–875"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/scripts/probe_workspace.py#L1-L40", "label": "probe_workspace docstring", "path": "scripts/probe_workspace.py", "lines": "1–40"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/scripts/setup_cohort.py#L3390-L3392", "label": "--probe-policy", "path": "scripts/setup_cohort.py", "lines": "3390–3392"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/adapters/databricks.py#L124-L136", "label": "workspace_client", "path": "src/course_assistant/adapters/databricks.py", "lines": "124–136"}], "docs": []}, {"id": "guard", "state": "auto", "title": "Paid-resource guard", "short": "a bundle job", "text": "A bundle job deletes a paid resource that a student creates outside the registry and stops a running student app, then emails and posts to Teams. A change of `system.access.audit` triggers it, at least 10 minutes apart. The app stop runs hourly.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/resources/guard.job.yml#L1-L74", "label": "guard.job.yml", "path": "resources/guard.job.yml", "lines": "1–74"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/resources/apps_stop.job.yml#L1-L20", "label": "apps_stop.job.yml", "path": "resources/apps_stop.job.yml", "lines": "1–20"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/src/course_assistant/monitoring/guard.py#L404-L490", "label": "sweep and guard", "path": "src/course_assistant/monitoring/guard.py", "lines": "404–490"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/TECHNICAL-DESIGN.md#L548", "label": "Decision: Paid-resource guard", "path": "docs/TECHNICAL-DESIGN.md", "lines": "548"}], "docs": []}, {"id": "review", "state": "hand", "title": "Pull request and review", "short": "by convention", "text": "A pull request is the only way to `main`, by convention: nothing on GitHub refuses a push to it, or a merge with a red check. The `test` and `evals` checks are read before the merge, and the `story-reviewer` agent reviews each story branch, read-only. `CODEOWNERS` names the teachers team, and this plan does not enforce it.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/CLAUDE.md#L94-L106", "label": "working rules: slice, review loop", "path": "CLAUDE.md", "lines": "94–106"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/CLAUDE.md#L86-L92", "label": "CLAUDE.md rule", "path": "CLAUDE.md", "lines": "86–92"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.claude/agents/story-reviewer.md#L1-L15", "label": "story-reviewer agent", "path": ".claude/agents/story-reviewer.md", "lines": "1–15"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/memory-bank/ACTIVE-CONTEXT.md#L31", "label": "Review trace", "path": "memory-bank/ACTIVE-CONTEXT.md", "lines": "31"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/stories/TEMPLATE.md#L1-L30", "label": "slice template", "path": "docs/stories/TEMPLATE.md", "lines": "1–30"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/CODEOWNERS#L1-L9", "label": "CODEOWNERS", "path": ".github/CODEOWNERS", "lines": "1–9"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/CODEOWNERS#L1-L5", "label": "CODEOWNERS comment", "path": ".github/CODEOWNERS", "lines": "1–5"}], "docs": []}, {"id": "bots", "state": "hand", "title": "Student bots", "short": "four simulated students", "text": "Four simulated students, `victor-bot-1` to `-4`, are onboarded like real ones. Each takes a lecture in its own repository as its own deploy principal and leaves a run log: a test of the template, of the course code against the workspace, and of the teacher surface.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/scripts/student_bot.py#L1-L60", "label": "student_bot.py", "path": "scripts/student_bot.py", "lines": "1–60"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/STUDENT-BOT.md#L1-L30", "label": "STUDENT-BOT.md", "path": "docs/STUDENT-BOT.md", "lines": "1–30"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/TECHNICAL-DESIGN.md#L623", "label": "Decision: Student bot", "path": "docs/TECHNICAL-DESIGN.md", "lines": "623"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.claude/agents/student.md#L1-L20", "label": "student agent", "path": ".claude/agents/student.md", "lines": "1–20"}], "docs": []}], "gaps_heading": "The gaps, next to what a full setup adds", "gaps": [{"id": "protection", "title": "Branch protection or rulesets", "today": "None on `main`: GitHub refuses both on a private repository of a Free organisation. A red check does not block a merge.", "full": "Required reviews and required status checks on `main`, on a paid plan.", "text": "Read on 2026-11-23: branch protection and rulesets both answer HTTP 403, \"Upgrade to GitHub Pro or make this repository public\", and `main` shows `protected: false`. The repository moved from CauchyIO into the cohort organisation on 2026-10-10, and CauchyIO's ruleset (one approving review, the `test` check) stopped guarding `main` at the move. Upgrading the organisation to Team would bring protection back.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/TECHNICAL-DESIGN.md#L392", "label": "Decision: The repository in the cohort org", "path": "docs/TECHNICAL-DESIGN.md", "lines": "392"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/RUNBOOK.md#L728", "label": "RUNBOOK § The switch, step 2", "path": "docs/RUNBOOK.md", "lines": "728"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/CLAUDE.md#L86-L92", "label": "CLAUDE.md rule", "path": "CLAUDE.md", "lines": "86–92"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/CODEOWNERS#L1-L9", "label": "CODEOWNERS", "path": ".github/CODEOWNERS", "lines": "1–9"}], "docs": [{"label": "About protected branches", "short": "protected branches", "url": "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches"}, {"label": "About rulesets", "short": "rulesets", "url": "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets"}]}, {"id": "acc", "title": "An acc environment for the platform", "today": "One workspace and one bundle target. No GitHub environments, so no approval before a deploy.", "full": "An acc workspace or target, and an approval before prd.", "text": "`databricks.yml` declares `targets: dev` only, with `mode: production` and one workspace host. `ci.yml` and `deploy.yml` validate and deploy `-t dev`, and the repository has no GitHub environments. The second workspace of 2026-11-02 replaced the first one, which had been banned: it is not a staging environment.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/databricks.yml#L69-L80", "label": "targets: dev only, mode: production, one host", "path": "databricks.yml", "lines": "69–80"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/docs/TECHNICAL-DESIGN.md#L499", "label": "decision row A second workspace", "path": "docs/TECHNICAL-DESIGN.md", "lines": "499"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/deploy.yml#L67-L71", "label": "validate and deploy", "path": ".github/workflows/deploy.yml", "lines": "67–71"}], "docs": [{"label": "Managing environments for deployment", "short": "environments", "url": "https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments"}]}, {"id": "validate", "title": "Bundle validation on pull requests", "today": "`bundle validate` runs on a push to `main` only, after the merge.", "full": "`bundle validate` on every pull request, before the merge.", "text": "The `bundle` job of `ci.yml` runs on a push to `main` only: the monitoring principal's federation policy accepts `main`, and a second policy for pull requests was never approved.", "links": [{"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/ci.yml#L57-L63", "label": "ci comment", "path": ".github/workflows/ci.yml", "lines": "57–63"}, {"url": "https://github.com/llmops-databricks-2/course-assistant/blob/main/.github/workflows/ci.yml#L64-L80", "label": "bundle job", "path": ".github/workflows/ci.yml", "lines": "64–80"}], "docs": []}], "foot": "No automatic rollback either: the way back is a revert merge and a re-run."}, "count": 90}</script>
<script>
(() => {
"use strict";
// The static close-up of part 4: the scene zoomed onto GitHub, two columns. The left one is the
// student template, where dev → acc → prd is real; the right one is the platform's own repository,
// its safety net as it is and its gaps next to what a full setup adds. The content is closeup.json,
// with every link resolved by build.py against the facts file. A row's title opens its first link;
// the row itself opens a card with what the facts say and every link.
//
// The page speaks the same protocol as the animation, so the deck can treat both alike:
//   out: {type: "part4", event: "ready"}
//   in:  {cmd: "scene", n: 1|2} puts the light on a column, {cmd: "step"} moves it on (both columns,
//        the first, the second, both), {cmd: "play"} and {cmd: "pause"} do nothing: nothing moves here.
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const post = (msg) => { if (window.parent !== window) window.parent.postMessage({type: "part4", page: "github", ...msg}, "*"); };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const STATE = {auto: "runs or holds by itself", hand: "by hand, or by convention", gap: "missing today"};
const ext = 'target="_blank" rel="noopener"';

const LOCK = '<svg class="lk" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.5" stroke="none"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke-width="2"/></svg>';
const flow = (items) => '<ol class="flow">' + items.map((f, i) =>
  `${i && f.arrow !== false && !f.lab ? '<li class="arr" aria-hidden="true">→</li>' : ""}${f.br ? '<li class="br" aria-hidden="true"></li>' : ""}` + (f.lab ? `<li class="lab">${esc(f.lab)}</li>` : `<li class="${f.state || ""}"${f.state ? ` title="${STATE[f.state]}"` : ""}>${f.lock ? LOCK : f.state && f.state !== "auto" ? `<i class="dot ${f.state}"></i>` : ""}<b${f.code ? ' class="mono"' : ""}>${esc(f.t)}</b>${f.n ? `<span>${esc(f.n)}</span>` : ""}</li>`)).join("") + "</ol>";
const link = (l) => `<a href="${esc(l.url)}" ${ext}>${esc(l.label)}</a>`;
const count = (r) => r.links.length + r.docs.length;
const more = (r) => `<button class="more" data-id="${r.id}" aria-label="${esc(r.title.replace(/`/g, ""))}: what the facts say, and all ${count(r)} links">${count(r)} links</button>`;
const row = (r) =>
  `<li class="row ${r.state}" data-id="${r.id}"><i class="dot ${r.state}" title="${STATE[r.state]}"></i>` +
  `<p><a class="row-t" href="${esc(r.links[0].url)}" ${ext} title="${esc(r.links[0].path)}, lines ${r.links[0].lines}">${md(r.title)}</a><span class="row-s">${md(r.short)}</span></p>${more(r)}</li>`;
const gap = (g) =>
  `<li class="gaprow" data-id="${g.id}"><div class="g-t"><i class="dot gap" title="${STATE.gap}"></i><p><a class="row-t" href="${esc(g.links[0].url)}" ${ext} title="${esc(g.links[0].path)}, lines ${g.links[0].lines}">${md(g.title)}</a></p>${more(g)}</div>` +
  `<p class="today">${md(g.today)}</p>` +
  `<p class="full">${md(g.full)}${g.docs.length ? `<span class="docs">GitHub Docs: ${g.docs.map((d) => `<a href="${esc(d.url)}" ${ext} title="${esc(d.label)}">${esc(d.short)}</a>`).join(", ")}</span>` : ""}</p></li>`;

const column = (c, hid) =>
  `<header class="col-h"><span class="num">${c.n}</span><h2 id="${hid}">${esc(c.title)}</h2><code>${esc(c.repo)}</code><span class="badge ${c.gaps ? "warn" : "good"}">${esc(c.badge)}</span></header>` +
  `<p class="lede">${md(c.lede)}</p>${flow(c.flow)}` +
  `<h3>${esc(c.heading)}</h3><ul class="rows${c.gaps ? " two" : ""}">${c.rows.map(row).join("")}</ul>` +
  (c.gaps ? `<h3>${esc(c.gaps_heading)}</h3><ul class="gaps"><li class="gaphead" aria-hidden="true"><span>The gap</span><span>Today</span><span>A full setup adds</span></li>${c.gaps.map(gap).join("")}</ul><p class="foot">${md(c.foot)}</p>` : "");
$("colA").innerHTML = column(D.student, "hA");
$("colB").innerHTML = column(D.platform, "hB");
$("readOn").textContent = D.read_on;
$("nAll").textContent = D.count;

// ----- the card of a row, and the list of every link -----
const ALL = [...D.student.rows, ...D.platform.rows, ...D.platform.gaps];
const dlg = $("dlg");
const linkList = (r) => '<ul class="links">' +
  r.links.map((l) => `<li>${link(l)}<code>${esc(l.path)}</code><span>lines ${l.lines}</span></li>`).join("") +
  r.docs.map((d) => `<li><a href="${esc(d.url)}" ${ext}>${esc(d.label)}</a><code>docs.github.com</code><span>GitHub Docs</span></li>`).join("") + "</ul>";
const open = (html) => { $("dlgB").innerHTML = html; if (!dlg.open) dlg.showModal(); $("dlgB").scrollTop = 0; };
const card = (id) => {
  const r = ALL.find((x) => x.id === id);
  if (!r) return;
  const state = r.state || "gap";
  open(`<p class="state"><i class="dot ${state}"></i>${STATE[state]}</p><h2 id="dlgT">${md(r.title)}</h2>` +
    (r.today ? `<p class="today"><b>Today</b>${md(r.today)}</p><p class="full"><b>A full setup adds</b>${md(r.full)}</p>` : "") +
    `<p>${md(r.text)}</p>${linkList(r)}`);
};
const everything = () => open(`<h2 id="dlgT">All ${D.count} links</h2><p>Each one opens the file on <code>main</code> of <code>llmops-databricks-2/course-assistant</code>, a private repository, at the lines read on ${D.read_on}; a later commit can move them.</p>` +
  [D.student, D.platform].map((c) => `<h3>${esc(c.title)}</h3>` + [...c.rows, ...(c.gaps || [])].map((r) => `<h4>${md(r.title)}</h4>${linkList(r)}`).join("")).join(""));
document.addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const hit = e.target.closest("[data-id]");
  if (hit && !dlg.contains(hit)) card(hit.dataset.id);
  else if (e.target === dlg) dlg.close();          // a click on the backdrop
});
$("bAll").onclick = everything;
$("dlgX").onclick = () => dlg.close();

// ----- the light on a column -----
let focus = 0;
const light = (n) => { focus = [0, 1, 2].includes(Number(n)) ? Number(n) : 0; $("cloud").dataset.focus = focus; };
document.querySelectorAll(".col-h").forEach((h, i) => { h.title = "Click to put the light on this column"; h.onclick = () => light(focus === i + 1 ? 0 : i + 1); });
window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.type !== "part4" || typeof m.cmd !== "string") return;
  if (m.cmd === "scene") light(m.n);
  else if (m.cmd === "step") light((focus + 1) % 3);
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || dlg.open) return;
  if (e.key === "1" || e.key === "2") light(Number(e.key));
  else if (e.key === "0") light(0);
  else if (e.key === "a") everything();
  else if (e.key.length > 1 && e.key !== "Tab" && e.key !== "Enter" && e.key !== "Shift" || /^[a-z]$/i.test(e.key)) post({event: "key", key: e.key, shiftKey: e.shiftKey});
});
light(new URLSearchParams(location.search).get("scene"));
window.__part4 = {light, card, everything, state: () => ({focus, links: D.count})};
post({event: "ready", ok: true});

})();
</script>
</body>
</html>
