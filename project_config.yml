# Project Configuration for LLMOps Course
system_prompt_file: prompts/linkedin_content.txt
usage_policy_id: "aab31ed1-3d45-30f4-bd70-ec76d652513c"

# Development environment
dev:
  catalog: llmops_dev
  schema: arxiv
  volume: arxiv_files
  llm_endpoint: course_ops.gateway.chat
  # Use the serving endpoint supported by batch ai_query and AI Search.
  embedding_endpoint: course_ops.gateway.embed
  warehouse_id: 9b96ea2aef8272f6
  experiment_path: /Shared/llmops-arxiv-curator-course
  lakebase_project_id: lb-llmops-dev
  # Group members authenticate with their own OAuth token and this database role.
  lakebase_user: grp-teachers-llmops
  agent_app_name: agent-arxiv-curator-dev

# Acceptance/Staging environment
acc:
  catalog: llmops_dev
  schema: arxiv
  volume: arxiv_files
  llm_endpoint: course_ops.gateway.chat
  # Use the serving endpoint supported by batch ai_query and AI Search.
  embedding_endpoint: course_ops.gateway.embed
  warehouse_id: 9b96ea2aef8272f6
  experiment_path: /Shared/llmops-arxiv-curator-course
  lakebase_project_id: lb-llmops-dev
  agent_app_name: agent-arxiv-curator-acc

# Production environment
prd:
  catalog: llmops_dev
  schema: arxiv
  volume: arxiv_files
  llm_endpoint: course_ops.gateway.chat
  # Use the serving endpoint supported by batch ai_query and AI Search.
  embedding_endpoint: course_ops.gateway.embed
  warehouse_id: 9b96ea2aef8272f6
  experiment_path: /Shared/llmops-arxiv-curator-course
  lakebase_project_id: lb-llmops-dev
  agent_app_name: agent-arxiv-curator-prd

# Model configuration
model_config:
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.95

# Vector search configuration
vector_search:
  embedding_dimension: 1024
  similarity_metric: cosine
  num_results: 5

# Chunking configuration
chunking:
  chunk_size: 512
  chunk_overlap: 50
  separator: "\n\n"
