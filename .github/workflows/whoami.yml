name: Who am I

# Platform lecture: how a GitHub Actions job becomes a Databricks service principal
# with no secret stored anywhere.
#
# 1. GitHub signs a short-lived OIDC token about this job: repository, environment, ref.
# 2. The service principal's federation policy in the Databricks account says which
#    issuer, subject and audience it trusts.
# 3. The CLI exchanges the GitHub token for a Databricks token as that principal.
#
# The environment's variable DATABRICKS_CLIENT_ID names the principal; its federation
# policy's subject must be repo:<org>/<repo>:environment:<environment>.

on:
  workflow_dispatch:
    inputs:
      target:
        description: GitHub environment to sign in from
        type: choice
        options: [dev, acc, prd]
        default: dev

permissions:
  contents: read
  id-token: write

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: The claims GitHub signs for this job
        # The token itself is never printed: only the claims the federation policy checks.
        run: |
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${DATABRICKS_HOST}/oidc/v1/token" \
          | python3 -c '
          import base64, json, sys
          payload = json.load(sys.stdin)["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          keys = ("iss", "sub", "aud", "repository", "environment", "ref")
          print(json.dumps({key: claims.get(key) for key in keys}, indent=2))
          '

      - name: Install Databricks CLI
        uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7 # v1.20.0
        with:
          version: 1.24.0

      - name: The Databricks identity it maps to
        run: |
          databricks auth describe
          databricks current-user me --output json | python3 -c '
          import json, sys
          me = json.load(sys.stdin)
          print("userName:", me.get("userName"), "| displayName:", me.get("displayName"))
          '
