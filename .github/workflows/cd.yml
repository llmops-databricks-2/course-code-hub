name: CD

on:
  push:
    branches:
      - main
      - lecture5 #temp
  workflow_dispatch:

concurrency:
  group: databricks-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install Databricks CLI
        uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7 # v1.20.0
        with:
          version: 1.20.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Deploy bundle resources
        run: |
          databricks bundle deploy \
            --target dev \
            --var="git_sha=${GITHUB_SHA}"

      - name: Run evaluation job
        run: |
          databricks bundle run lecture5_evaluation \
            --target dev

      - name: Deploy App after successful evaluation
        run: |
          databricks bundle run lecture5_app_deployment \
            --target dev
