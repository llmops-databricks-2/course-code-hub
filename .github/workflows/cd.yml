name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: databricks-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1

      - name: Deploy bundle resources
        run: |
          databricks bundle deploy \
            --target dev \
            --var="git_sha=${GITHUB_SHA}"

      - name: Evaluate and grant App secret access
        run: |
          databricks bundle run evaluate_grant_permissions \
            --target dev

      - name: Start or restart App
        run: |
          databricks bundle run arxiv_agent_app \
            --target dev

      - name: Wait for App startup
        env:
          APP_NAME: agent-arxiv-curator-dev
        run: |
          for attempt in $(seq 1 20); do
            state=$(databricks apps get "$APP_NAME" --output json | jq -r '.app_status.state')
            echo "Attempt $attempt/20: App state=$state"
            if [ "$state" = "RUNNING" ]; then
              exit 0
            fi
            if [ "$state" = "CRASHED" ]; then
              echo "App startup failed" >&2
              exit 1
            fi
            sleep 15
          done
          echo "App did not reach RUNNING state within 5 minutes" >&2
          exit 1
