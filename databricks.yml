# Databricks Asset Bundle configuration for LLMOps Course
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation

bundle:
  engine: direct
  name: course-code-hub
  # 1.23.0 adds lifecycle.depends_on for explicit resource deployment ordering.
  databricks_cli_version: ">= 1.23.0"

artifacts:
  default:
    type: whl
    build: uv build --native-tls
    path: .

variables:
  agent_service_principal_id:
    description: Existing agent runtime service principal granted access to Genie
    default: 180dc237-d53d-4e39-bf7f-86ad2533ed88
  git_sha:
    description: git_sha
    default: unknown
  branch:
    description: branch
    default: main
  experiment_id:
    description: MLflow experiment ID for the target environment
    default: "265038258403436"
  schedule_pause_status:
    description: schedule pause status
    default: PAUSED
  usage_policy_id:
    description: usage policy id for serverless jobs and Apps (usage_policy_id in project_config.yml)
    default: aab31ed1-3d45-30f4-bd70-ec76d652513c
  # Keep these in sync with the per-environment values in project_config.yml.
  warehouse_id:
    description: SQL warehouse for the Genie space (warehouse_id in project_config.yml)
    default: 9b96ea2aef8272f6
  catalog:
    description: Unity Catalog catalog (catalog in project_config.yml)
    default: llmops_dev
  schema:
    description: schema holding arxiv_papers (schema in project_config.yml)
    default: arxiv

include:
  - resources/process_data.yml
  - resources/initialize_data.yml
  # - resources/testing_jobs/*.yml
  - resources/genie_space.yml
  - resources/agent_app.yml
  - resources/evaluate_deploy_app.yml
  - resources/monitoring_view.yml
  - resources/monitoring_dashboard.yml

sync:
  include:
    - eval_inputs.txt
    - project_config.yml
    - prompts/*.txt

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}

  acc:
    mode: production
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.target}/${bundle.name}
    variables:
      experiment_id: "265038258403437"
      catalog: llmops_acc
      schema: arxiv
      schedule_pause_status: PAUSED

  prd:
    mode: production
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.target}/${bundle.name}
    variables:
      experiment_id: "265038258403438"
      catalog: llmops_prd
      schema: arxiv
      schedule_pause_status: UNPAUSED
