# Databricks Asset Bundle configuration for LLMOps Course
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation

bundle:
  name: course-code-hub
  # 1.20.0 is the first CLI that knows a model provider service's secret reference
  # (resources/gateway_demo.yml); an older one skips the gateway resources with a warning.
  databricks_cli_version: ">= 1.20.0"

artifacts:
  default:
    type: whl
    build: uv build
    path: .

variables:
  git_sha:
    description: git_sha
    default: abcd
  branch:
    description: branch
    default: main
  schedule_pause_status:
    description: schedule pause status
    default: PAUSED

include:
  - resources/*.yml

sync:
  include:
    - eval_inputs.txt
    - project_config.yml

targets:
  dev:
    workspace:
      host: https://dbc-88df4c2c-4033.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}

  acc:
    mode: production
    workspace:
      host: https://dbc-88df4c2c-4033.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.target}/${bundle.name}
    variables:
      schedule_pause_status: PAUSED

  prd:
    mode: production
    workspace:
      host: https://dbc-88df4c2c-4033.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.target}/${bundle.name}
    variables:
      schedule_pause_status: UNPAUSED
