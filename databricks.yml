# Databricks Asset Bundle configuration for LLMOps Course
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation

bundle:
  engine: direct
  name: course-code-hub
  # 1.20.0 is the first CLI that knows a model provider service's secret reference
  # (resources/gateway_demo.yml); an older one skips the gateway resources with a warning.
  databricks_cli_version: ">= 1.20.0"

artifacts:
  default:
    type: whl
    build: uv build
    path: .

variables:
  git_sha:
    description: git_sha
    default: abcd
  branch:
    description: branch
    default: main
  schedule_pause_status:
    description: schedule pause status
    default: PAUSED
  usage_policy_id:
    description: usage policy id for serverless jobs (usage_policy_id in project_config.yml)
    default: aab31ed1-3d45-30f4-bd70-ec76d652513c
  # Keep these in sync with the per-environment values in project_config.yml.
  warehouse_id:
    description: SQL warehouse for the Genie space (warehouse_id in project_config.yml)
    default: 9b96ea2aef8272f6
  catalog:
    description: Unity Catalog catalog (catalog in project_config.yml)
    default: llmops_dev
  schema:
    description: schema holding arxiv_papers (schema in project_config.yml)
    default: arxiv

include:
  - resources/process_data.yml
  - resources/lecture3_tools.yml
  - resources/ai_search.yml
  - resources/synced_tables.yml
  - resources/genie_space.yml

sync:
  include:
    - eval_inputs.txt
    - project_config.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}

  acc:
    mode: production
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.target}/${bundle.name}
    variables:
      schedule_pause_status: PAUSED

  prd:
    mode: production
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.target}/${bundle.name}
    variables:
      schedule_pause_status: UNPAUSED
