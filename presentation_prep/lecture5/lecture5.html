<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecture 5: Deploying AI Agents on Databricks</title>
  <link rel="stylesheet" href="../lecture4/lecture4.css">
</head>
<body>
<main id="deck"></main>
<nav class="deck-controls" aria-label="Presentation controls">
  <button id="previous">Previous</button><span id="slide-counter"></span>
  <button id="next">Next</button><button id="present">Present</button><button id="notes">Notes</button>
</nav>
<dialog id="notes-dialog" class="notes-dialog" hidden><button id="close-notes">Close</button><div id="notes-content"></div></dialog>
<script>
const deckSlides = [
['cover','Deploying an AI Application<br>on Databricks','Databricks Apps, Asset Bundles and CI/CD','11 November 2026','Lecture 5. We move the arXiv agent from notebooks into a repeatable App deployment workflow. The focus is application runtime, resource configuration, authentication and release automation.'],
['agenda','Agenda','What we will cover today',['Databricks Apps as the runtime','CI/CD pipelines','Authentication patterns','Databricks Asset Bundles','Databricks platform architecture','App resources and release gates'],'We connect the course components into a release process rather than treating App deployment as a one-off UI action.'],
['divider','Bringing components together','','','This lecture connects the agent, its data resources, its identity and its deployment pipeline.'],
['content','Databricks Apps as the runtime','The agent runs as an application',['The App exposes the Responses API','The App bundles the Python runtime and dependencies','The App service principal accesses declared resources','The SDK redeploys the App source after evaluation'],'Other deployment options exist, but this course uses Databricks Apps because the arXiv agent is an application with an API, resources and a release lifecycle.'],
['content','The App deployment boundary','One runtime, several governed resources',['Application source and startup command','Lakebase PostgreSQL for retrieval and memory','Genie space for governed analytics','MLflow experiment for traces','Unity Gateway model services for inference'],'The App is the runtime boundary. Its identity must be able to use each declared resource, while the bundle remains the source of truth for deployment.'],
['divider','Authentication','','','Authentication is part of deployment design. The identity that deploys resources and the identity that runs the App must be understood separately.'],
['content','Authentication patterns','MLflow resources are identity-sensitive',['Resources supplied while logging a model','Resource permissions can be evaluated as the creator','The deployment identity must have the required access'],'When an agent is logged or deployed, resource permissions are not implicit. The identity and permission model determine whether the deployment can use its dependencies.'],
['content','Authentication patterns','On-behalf-of-user access',['Caller permissions are applied','Useful when the App acts for a user','Requires the appropriate user authorization scopes'],'Use on-behalf-of-user authentication when access should follow the current user. Use App authorization when the App should act with its own stable identity.'],
['content','Authentication patterns','App resources make dependencies explicit',['Lakebase or PostgreSQL','Genie and SQL warehouse','MLflow experiment','Unity Gateway model services','Secrets referenced through App configuration'],'Declare resources in the App configuration so Databricks can grant the App service principal the required access.'],
['content','Supported App resource identities','Resource permissions depend on the runtime identity',['The deployment SPN needs permission to create or update the App','The App service principal needs permission to use runtime resources','Unity Gateway resources can grant supported model-service privileges','Table and database privileges still require explicit grants'],'Do not confuse the identity that deploys the App with the identity that runs it. A successful bundle deployment does not prove that the App can access every downstream table or service.'],
['content','Supported clients','Different clients expose different interfaces',['OpenAI client for Responses or chat APIs','Databricks SDK for platform operations','Databricks SQL and PostgreSQL clients for data access'],'The client must match the endpoint. The OpenAI client is useful for model APIs, while the SDK is used for bundle, App and resource management.'],
['content','App authentication pitfalls','Environment variables determine the runtime identity',['DATABRICKS_HOST','App resource valueFrom references','GitHub OIDC for deployment','The App service principal for runtime access','No long-lived credentials in source control'],'The deployment identity and the App runtime identity are separate. GitHub uses short-lived OIDC credentials, while the App uses its configured service principal and declared resources.'],
['content','App resources','Declare dependencies next to the App',['MLflow experiment','Genie space','Lakebase PostgreSQL','SQL warehouse','Unity Gateway model services'],'App resources make dependencies visible in the bundle. Databricks can grant the App service principal the permissions required by supported resources, while data-table privileges still need explicit governance. See the Databricks Apps resources documentation.'],
['content','Production tracing in an App','Tracing needs an experiment and runtime access',['Add the MLflow experiment as an App resource','Expose MLFLOW_EXPERIMENT_ID with valueFrom','Set ENABLE_MLFLOW_TRACING=true','Grant the App identity permission to write traces','Query traces from the experiment UI'],'The App writes traces to the configured MLflow experiment. The application code supplies custom spans, and the App resource configuration supplies the destination and access. See the Databricks Apps MLflow documentation.'],
['content','Tracing in a Databricks App','Custom spans continue to work in the App',['ResponsesAgent spans in agent.py','LLM spans around model calls','Tool spans around Lakebase and Genie calls','Session and request metadata','MLflow experiment configured by the App'],'Our custom ResponsesAgent still owns the tracing logic. Moving from a notebook to an App changes the runtime and identity, not the span design.'],
['divider','Databricks platform architecture','','','Before deploying resources, distinguish the account, workspace, metastore, Unity Catalog and application runtime.'],
['content','Asset organization in Unity Catalog','Three-part names identify governed assets',['Catalog','Schema','Asset: table, view, volume, model or function','catalog.schema.asset'],'Bundle definitions and application code should use stable, fully qualified resource names wherever possible.'],
['content','Account and metastores','Workspaces belong to an account',['Account administrators manage workspaces','The metastore provides the governance boundary','Workspace users work with catalogs and schemas'],'Account-level configuration and workspace-level operations are different permissions. CI/CD identities may need access at both levels.'],
['content','Workspace and Unity Catalog securables','Permissions exist at multiple layers',['Workspace permissions','Catalog and schema privileges','Table, model, function and volume privileges','App resource permissions'],'Grant the minimum permission at the layer where it is required. App resource access and PostgreSQL table privileges are separate.'],
['content','Catalog and workspace permissions','Identity controls access',['USE CATALOG','USE SCHEMA','SELECT or MODIFY on data','EXECUTE on model services','CAN USE or CAN MANAGE on platform resources'],'A deployment can succeed while a runtime call fails if the runtime identity lacks downstream permissions. Test the deployed path, not only the bundle creation.'],
['divider','Deployment strategies','','','We now compare deployment mechanisms and focus on the approach used in the course.'],
['content','Declarative Automation Bundles','The deployment definition is code',['Resources are declared in YAML','Targets define environment-specific values','The CLI validates, deploys and runs resources'],'Asset Bundles make infrastructure and jobs reviewable. The bundle is the source of truth for deployment structure.'],
['content','Three main ways to deploy resources','Databricks supports multiple control planes',['Databricks API or CLI','Databricks SDK','Declarative Automation Bundles'],'The CLI and SDK are useful building blocks. Bundles provide the repeatable composition that ties resources, artifacts and targets together.'],
['content','Why use Asset Bundles?','Recommended for repeatable deployment',['Version-controlled definitions','Reusable targets','Dependency-aware resources','Consistent CI/CD behavior'],'A bundle makes a deployment reproducible. It also gives reviewers a place to inspect permissions, environment values and job dependencies.'],
['content','Bundle variables and deployment metadata','Small parameters have operational impact',['git_sha records the deployed revision','schedule_pause_status controls schedules','usage_policy_id controls serverless budget policy','Targets override environment values'],'Pass release metadata explicitly. A deployment should tell us which revision ran and which environment settings were applied.'],
['content','Bundle artifacts','The build step packages application code',['The artifact builds the wheel','Jobs install the wheel in their environment','The App receives the source code snapshot','The same commit drives the release'],'A bundle deploy can upload both source files and a wheel. Keep the package build deterministic so CI and Databricks use the same code.'],
['content','Bundle components','Split large definitions into focused files',['databricks.yml is the entry point','include adds resource definitions','Resources can be grouped by concern','The final bundle is evaluated as one configuration'],'Separate files improve reviewability without changing the deployed resource graph. The include list must contain every resource needed by the target.'],
['content','Files to sync','Bundle sync controls workspace source files',['Everything is synced by default','.gitignore excludes files','sync.include narrows required inputs','eval_inputs.txt and project_config.yml must be available to jobs'],'A job can fail simply because a required file was not synced. Treat bundle sync rules as part of the application contract.'],
['content','Targets and modes','Environment configuration changes behavior',['dev, acc and prd can override values','Development mode pauses schedules and adds presets','Production mode uses shared paths','Do not mix target resources accidentally'],'Targets are not just labels. They control workspace paths, schedules and the values passed into deployment jobs.'],
['content','Essential bundle commands','The CLI workflow is small and explicit',['databricks bundle validate','databricks bundle deploy','databricks bundle run','databricks bundle destroy'],'Validate catches configuration problems. Deploy creates or updates resources. Run executes a selected job. Destroy should be reserved for deliberate cleanup.'],
['content','What can bundles create?','A broad set of Databricks resources',['Apps and jobs','MLflow experiments','Lakebase objects','Genie spaces','Unity Catalog objects','SQL warehouses and serving resources'],'Not every resource is equally suitable for every lifecycle. Check whether the object is stable infrastructure or a frequently changing model deployment.'],
['content','Is a bundle always optimal?','Use judgment by resource type',['Apps: yes','Jobs and pipelines: yes','Lakebase objects: yes','MLflow experiments: usually','Dynamic model versions: evaluate carefully','Platform-owned catalogs and warehouses: coordinate'],'Bundles are strongest when the team owns the lifecycle. Shared platform resources may belong in a separate platform-managed bundle.'],
['divider','Demo','','','The demo follows the deployment flow from the repository and shows where identity, resources and validation appear.'],
['content','Resources in this course','The Lecture 5 bundle deploys the release path',['Agent App','Genie space','MLflow experiment','Lakebase/PostgreSQL resource','Evaluation and App deployment jobs','Source package and configuration'],'The App depends on the same agent and retrieval code used in earlier lectures. Lecture 5 adds the runtime and release automation around it.'],
['content','The release flow','Evaluation gates App redeployment',['GitHub Actions authenticates with OIDC','Bundle deploy creates or updates the App and resources','Evaluation job runs against the candidate code','Deployment job runs only after evaluation succeeds','The deployment job calls the Apps SDK'],'Keep evaluation and deployment as separate jobs. The workflow checks the evaluation job result before redeploying the App source.'],
['content','GitHub Actions with OIDC','No Databricks secret is stored in GitHub',['DATABRICKS_AUTH_TYPE=github-oidc','DATABRICKS_HOST is a repository variable','DATABRICKS_CLIENT_ID is a repository variable','GitHub supplies a short-lived OIDC token','A Databricks federation policy authorizes the deployment SPN'],'The workflow needs id-token: write. The federation policy must match the repository and environment subject, and the deployment SPN must own or control the App. See the Databricks Apps CI/CD documentation.'],
['content','Week 5 deliverables','A small deployment project',['Create deployment scripts','Create the Asset Bundle','Configure and pass parameters','Validate and deploy to dev','Optionally demonstrate CI/CD'],'Use a dedicated development identity. Never put personal or company credentials in the repository or in workflow YAML.'],
['content','Questions?','','','The deployment pattern is now ready to adapt to another agent use case.']
];
const deck=document.querySelector('#deck');
for (let i=0;i<deckSlides.length;i++) {
  const [kind,title,subtitle,items,notes]=deckSlides[i];
  const section=document.createElement('section'); section.className=`slide ${kind==='cover'?'cover':kind==='divider'?'divider':'content-slide'}`; section.dataset.slide=i+1; section.id=`slide-${i+1}`; section.setAttribute('aria-label',title.replace(/<br>/g,' '));
  if(kind==='cover'){section.innerHTML=`<div class="content"><div class="cover-copy"><p class="eyebrow">LECTURE 5</p><h1>${title}</h1><p class="cover-sub">${subtitle}</p><p class="cover-date">${items}</p><p>LLMOps with Databricks</p></div></div>`;}
  else if(kind==='divider'){section.innerHTML=`<div class="content"><div class="section-heading"><h1>${title}</h1></div></div>`;}
  else {const list=Array.isArray(items)?`<ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul>`:''; section.innerHTML=`<p class="section-tag">LECTURE 5</p><h2>${title}</h2><div class="content"><p class="lead">${subtitle}</p><div class="box"><h3>${Array.isArray(items)?'Key points':'Lecture focus'}</h3>${list||`<p>${items||''}</p>`}</div><div class="takeaway">${Array.isArray(items)?notes:''}</div></div>`;}
  section.insertAdjacentHTML('beforeend',`<aside class="notes"><p>${notes||''}</p></aside>`); deck.append(section);
}
</script>
<script src="../lecture4/lecture4.js"></script>
</body>
</html>
