resources:
  jobs:
    synced-tables:
      name: arxiv-synced-tables
      budget_policy_id: "${var.usage_policy_id}"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: lakebase_synced_tables
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/2.5_synced_tables.py
            base_parameters:
              env: "${bundle.target}"
