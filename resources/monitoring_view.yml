resources:
  job_runs:
    initialize-monitoring-view:
      job_id: ${resources.jobs.monitoring-view.id}
      lifecycle:
        triggers:
          - on_bundle_deploy: true
  jobs:
    monitoring-view:
      name: monitoring-view-${bundle.target}
      budget_policy_id: "${var.usage_policy_id}"
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: create_view
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/6.2_create_monitoring_view.py
            base_parameters:
              env: "${bundle.target}"
