resources:
  jobs:
    lecture6-propagate-traces:
      name: lecture6-propagate-traces-${bundle.target}
      budget_policy_id: "${var.usage_policy_id}"
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../../dist/*.whl
      tasks:
        - task_key: propagate_traces
          environment_key: default
          notebook_task:
            notebook_path: ../../notebooks/6.0_propagate_traces.py
            base_parameters:
              env: "${bundle.target}"
              request_count: "10"
