resources:
  jobs:
    lecture6-monitoring:
      name: lecture6-monitoring-${bundle.target}
      budget_policy_id: "${var.usage_policy_id}"
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../../dist/*.whl
      tasks:
        - task_key: evaluate_traces
          environment_key: default
          notebook_task:
            notebook_path: ../../notebooks/6.1_monitoring_traces_and_tables.py
            base_parameters:
              env: "${bundle.target}"
              llm_sample_rate: "0.1"
              lookback_days: "7"
