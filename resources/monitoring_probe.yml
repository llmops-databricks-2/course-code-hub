resources:
  jobs:
    app_health_probe:
      name: app-health-probe-${bundle.target}
      budget_policy_id: "${var.usage_policy_id}"
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - maria@cauchy.io
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: Europe/Amsterdam
        pause_status: "${var.monitoring_alert_pause_status}"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: check_app_health
          environment_key: default
          notebook_task:
            notebook_path: deployment_scripts/check_app_health.py
            base_parameters:
              env: "${bundle.target}"
