resources:
  jobs:
    data-pipeline:
      name: arxiv-data-pipeline
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Europe/Amsterdam"
        pause_status: "${var.schedule_pause_status}"
      budget_policy_id: "${var.usage_policy_id}"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: arxiv_data_ingestion
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/1.3_arxiv_data_ingestion.py
            base_parameters:
              env: "${bundle.target}"
