resources:
  jobs:
    evaluate_deploy_app:
      name: evaluate_deploy_app-${bundle.target}
      budget_policy_id: "${var.usage_policy_id}"
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: evaluate_deploy_app
          environment_key: default
          notebook_task:
            notebook_path: deployment_scripts/evaluate_deploy_app.py
            base_parameters:
              env: "${bundle.target}"
              source_code_path: "${workspace.file_path}/app_deployment"
              genie_space_id: "${resources.genie_spaces.arxiv-curator-space.id}"
              git_sha: "${var.git_sha}"
              git_branch: "${var.branch}"
