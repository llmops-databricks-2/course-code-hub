resources:
  jobs:
    evaluate_grant_permissions:
      name: evaluate_grant_permissions-${bundle.target}
      budget_policy_id: "${var.usage_policy_id}"
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: evaluate_agent
          environment_key: default
          notebook_task:
            notebook_path: deployment_scripts/evaluate_agent.py
            base_parameters:
              env: "${bundle.target}"
              genie_space_id: "${resources.genie_spaces.arxiv-curator-space.id}"
        - task_key: grant_app_secret_access
          environment_key: default
          notebook_task:
            notebook_path: deployment_scripts/grant_app_secret_access.py
            base_parameters:
              env: "${bundle.target}"
